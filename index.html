/* table */

td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* lists */

<script>
window.mountGV=function(ROOT){
const DEFAULT_LISTS = {

  nguoi:["Nghĩa","Huy"],
  thoiGianThue:["Thuê 1 ngày","Thuê 2 ngày","Thuê 3 ngày","Thuê 1 tuần","Thuê 2 tuần","Thuê 1 tháng"],

};
const LIST_LABELS = {mucDich:"Mục đích (MĐ)",nguoi:"Người thực hiện",thoiGianThue:"Thời gian thuê",tienDo:"Tiến độ công việc",trangThai:"Trạng thái",giayTo:"Giấy tờ",tinhTrangDon:"Tình trạng đơn",checklist:"Checklist mặc định cho đơn mới"};
let checks = [], logs = [], files = [], assets = null, dl = null, items = [], machines = [], machinesAt = "";
const PRIOS = ["Gấp","Hơi gấp","Bình thường","Không gấp"];

const FIELDS = ["congTy","mucDo","mucDich","sl","noiDung","sn","snNhan","linkCT","ngayGiao","gioGiao","thoiGianThue","nhanViec","diaDiem","sdt","hanhTrinh","ngayThuHoi","gioThuHoi","nguoi","tienDo","trangThai","tinhTrangDon","giayTo","phuPhi","phuPhiND","tangCa","ghiChu","phanHoiKH","yKienKH"];
const TITLES = {ov:"Tổng quan",board:"Điều phối",agenda:"Lịch giao / thu hồi",table:"Danh sách đơn",lists:"Danh mục"};

let jobs = [];
let db = null, readOnly = false, roBase = false, editingId = null, stars = 0, view = "ov", ptags = [], ftags = [];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

// ---------- dates ----------
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayIso = () => iso(new Date());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fmt = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}`; };
const fmtFull = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; };
const addDays = (s,n) => { const t=parse(s); t.setDate(t.getDate()+n); return iso(t); };
function rentalDays(label){
  const m = /(\d+)\s*(ngày|tuần|tháng)/i.exec(label||""); if(!m) return null;
  const n = +m[1], u=m[2].toLowerCase(); return u==="ngày"?n: u==="tuần"?n*7:n*30;
}
const WD = ["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"];
const WDS = ["T2","T3","T4","T5","T6","T7","CN"];
const wd = s => WD[parse(s).getDay()];
const mondayOf = s => { const d=parse(s); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); };
function isoWeek(s){ const d=parse(s); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const w1=new Date(d.getFullYear(),0,4); return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7); }

// ---------- helpers ----------
const mdClass = md => /thu/i.test(md)&&/hồi/i.test(md)?"mdThu": /đổi/i.test(md)?"mdDoi": /bán/i.test(md)?"mdBan":"mdThue";
const STATUS_TONE={"Chưa giao":"bad","Đang chuẩn bị":"warn","Đang giao":"info","Đã giao":"warn","Đã thu hồi":"ok","Hoàn tất":"ok"};
const statusChip = s => s?`<span class="chip ${STATUS_TONE[s]||""}">${esc(s)}</span>`:"";
const money = v => { const n=+String(v||"").replace(/\D/g,""); return n? n.toLocaleString("vi-VN")+"đ":""; };
const isDone = j => DONE.includes(j.trangThai);
const needsPickup = j => j.ngayThuHoi && !isDone(j);
const pickupLate = j => needsPickup(j) && j.ngayThuHoi < todayIso();
const pct = (a,b) => b? a/b : null;
const vn = (n,d=1) => n.toFixed(d).replace(".",",");
const personColor = name => { const i=lists.nguoi.indexOf(name); return i<0? "var(--muted)" : `var(--s${i%8+1})`; };
const initials = name => (name||"?").trim().split(/\s+/).map(w=>w[0]).slice(-2).join("").toUpperCase();

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
function notice(msg){ const n=$("#notice"); n.textContent=msg||""; n.hidden=!msg; }

// tooltip
const tip=$("#tip");
ROOT.addEventListener("pointermove",e=>{
  const t=e.target.closest?.("[data-tip]");
  if(!t){ tip.hidden=true; return; }
  tip.textContent=t.dataset.tip; tip.hidden=false;
  const x=Math.min(e.clientX+12, innerWidth-tip.offsetWidth-8), y=Math.max(8,e.clientY-tip.offsetHeight-10);
  tip.style.left=x+"px"; tip.style.top=y+"px";
});

// ---------- filters ----------
function fillSelect(el, opts, {blank, all}={}){
  const cur = el.value;
  el.innerHTML = (all?`<option value="">${esc(all)}</option>`:"") + (blank?`<option value="">—</option>`:"") + opts.map(o=>`<option>${esc(o)}</option>`).join("");
  if([...el.options].some(o=>o.value===cur)) el.value=cur;
}
const isGH=j=>/gia h/i.test(String(j.mucDich||"").normalize("NFD").replace(/[\u0300-\u036f]/g,""));
const jobMonth=j=>{ const back=isGH(j)||j.trangThai==="Đã giao"||isDone(j); return ((back&&j.ngayThuHoi)?j.ngayThuHoi:(j.ngayGiao||j.ngayThuHoi||"")).slice(0,7); };
function refreshFilters(){
  fillSelect($("#fPerson"), lists.nguoi, {all:"Tất cả nhân viên"});
  fillSelect($("#fMd"), lists.mucDich, {all:"Tất cả mục đích"});
  const months = [...new Set(jobs.map(jobMonth).filter(Boolean))].sort().reverse();
  const cur=$("#fMonth").value;
  $("#fMonth").innerHTML = `<option value="">Mọi tháng</option>` + months.map(m=>`<option value="${m}">Tháng ${+m.slice(5)}/${m.slice(0,4)}</option>`).join("");
  if(months.includes(cur)) $("#fMonth").value=cur;
}
let drawerCan=false;
const isViewerNow=()=>!!(window.KHO&&window.KHO.viewer&&window.KHO.viewer());
function canAccept(j){ if(roBase||!j||!j.nguoi) return false; if(!isViewerNow()) return true; return !!(window.KHO.mine&&window.KHO.mine(j)); }
const isAccepted=j=>!!j&&j.nhanViec==="Đã nhận việc";
function canEdit(j){ if(roBase) return false; if(!isViewerNow()) return true; return !!(j&&window.KHO.mine&&window.KHO.mine(j)&&isAccepted(j)); }
function renderAccept(){ const box=$("#acceptRow"); if(!box) return; const nm=$("#nguoi").value, acc=$("#nhanViec").value==="Đã nhận việc", j=editingId?jobs.find(x=>x.id===editingId):null;
  if(!nm){ box.innerHTML=`<span class="hint">Chọn người nhận việc. Người đó sẽ thấy đơn và bấm “Nhận việc” để bắt đầu.</span>`; return; }
  const sameAsSaved = j && j.nguoi===nm;
  box.innerHTML = acc&&sameAsSaved ? `<span class="acc-chip ok">✓ ${esc(nm)} đã nhận việc${j&&j.acceptedAt?` · ${esc(new Date(j.acceptedAt).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"}))}`:""}</span>`
    : `<span class="acc-chip wait">⏳ Chờ ${esc(nm)} nhận việc</span>${j&&sameAsSaved&&canAccept(j)?`<button type="button" class="btn sm primary" id="acceptBtn">✓ ${isViewerNow()?"Tôi nhận việc này":"Đánh dấu "+esc(nm)+" đã nhận"}</button>`:""}${!sameAsSaved&&j?'<span class="hint">Lưu đơn để giao cho người mới.</span>':""}`;
  const b=$("#acceptBtn"); if(b) b.addEventListener("click", async()=>{ const id=editingId; await acceptJob(id); const jj=jobs.find(x=>x.id===id); if(jj){ jj.nhanViec="Đã nhận việc"; jj.acceptedAt=jj.acceptedAt||new Date().toISOString(); openDrawer(jj); } }); }
function canEdit_(j){ return canEdit(j); }
function filtered(){
  const pr=$("#fPrio").value;
  const q=$("#q").value.trim().toLowerCase(), p=$("#fPerson").value, md=$("#fMd").value, mo=$("#fMonth").value;
  const viewer = window.KHO && window.KHO.viewer && window.KHO.viewer(), me = viewer ? window.KHO.myId() : null;
  readOnly = roBase || (!!viewer && !drawerCan); { const nb=$("#newBtn"); if(nb) nb.hidden = roBase || !!viewer; }
  return jobs.filter(j=>{
    if(viewer && !(window.KHO.sees ? window.KHO.sees(j) : (Array.isArray(j.phuTrach) && j.phuTrach.includes(me)))) return false;
    if(pr && prioOf(j)!==pr) return false;
    if(p && !String(j.nguoi||"").split(/\s*,\s*/).includes(p)) return false;
    if(md && j.mucDich!==md) return false;
    if(mo && jobMonth(j)!==mo) return false;
    if(q){ const hay=[j.congTy,j.noiDung,j.sn,j.diaDiem,j.sdt,j.ghiChu,...(j.phuTrach||[]).map(tagName),...(j.theoDoi||[]),...(j.items||[]).map(i=>i.sku+" "+(i.name||""))].join(" ").toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
}

// ---------- metrics ----------
const hasP=(j,p)=>p===""?!j.nguoi:String(j.nguoi||"").split(/\s*,\s*/).includes(p);
function stats(js){
  const done=js.filter(isDone);
  const timed=done.filter(j=>j.doneAt && j.ngayThuHoi);
  const onTime=timed.filter(j=>j.doneAt<=j.ngayThuHoi).length;
  const rated=js.filter(j=>j.danhGia);
  const avg=rated.length? rated.reduce((s,j)=>s+j.danhGia,0)/rated.length : null;
  const parts=[[pct(done.length,js.length),40],[pct(onTime,timed.length),30],[avg==null?null:avg/5,30]].filter(p=>p[0]!=null);
  const w=parts.reduce((s,p)=>s+p[1],0);
  const score = js.length && w ? parts.reduce((s,p)=>s+p[0]*p[1],0)/w*100 : null;
  return {n:js.length, done:done.length, timed:timed.length, onTime, rated:rated.length, avg, score,
    may:js.reduce((s,j)=>s+(+j.sl||0),0), fee:js.reduce((s,j)=>s+(+String(j.phuPhi||"").replace(/\D/g,"")||0),0), late:js.filter(pickupLate).length};
}

  run:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>',
  done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>'

function renderOverview(list){
  const late=list.filter(pickupLate).length;
  const todo=list.filter(j=>(j.trangThai||"Chưa giao")==="Chưa giao").length;

function gaugeSvg(name, s, col){
  const R=58, cx=80, cy=80, a0=Math.PI*0.8, a1=Math.PI*2.2, span=a1-a0;
  const pt=a=>[cx+R*Math.cos(a), cy+R*Math.sin(a)];

  const v=s.score, end=v==null?a0:a0+span*Math.max(0.005,v/100);
  const [lx,ly]=pt(a0), [rx,ry]=pt(a1);
  const tipTxt=`${name}: ${v==null?"chưa có dữ liệu":vn(v)+" điểm"} · ${s.done}/${s.n} đơn hoàn thành${s.avg!=null?" · QL "+vn(s.avg)+"★":""}`;
  return `<div class="gauge" data-tip="${esc(tipTxt)}">
    <svg viewBox="0 0 160 132" role="img" aria-label="${esc(tipTxt)}">
      <path d="${arc(a0,a1)}" style="fill:none;stroke:var(--sunk);stroke-width:12;stroke-linecap:round"/>
      ${v==null?"":`<path d="${arc(a0,end)}" style="fill:none;stroke:${col};stroke-width:12;stroke-linecap:round"/>`}
      <text x="${cx}" y="${cy+4}" text-anchor="middle" style="font:700 24px var(--f-mono);fill:var(--fg)">${v==null?"—":vn(v)}</text>
      <text x="${cx}" y="${cy+22}" text-anchor="middle" style="font:500 10px var(--f-body);fill:var(--muted)">điểm hiệu quả</text>
      <text x="${lx.toFixed(0)}" y="${(ly+16).toFixed(0)}" text-anchor="middle" style="font:500 10px var(--f-mono);fill:var(--muted)">0</text>
      <text x="${rx.toFixed(0)}" y="${(ry+16).toFixed(0)}" text-anchor="middle" style="font:500 10px var(--f-mono);fill:var(--muted)">100</text>
    </svg>
    <div class="nm">${esc(name)}</div>
    <div class="sb">${s.n} đơn · ${s.may} máy</div>
  </div>`;
}
function donutPaths(ent,total,R,r){
  let a=-Math.PI/2, out="";
  const gap = ent.length>1 ? 0.025 : 0;
  ent.forEach(([k,v,col])=>{
    const ang=v/total*2*Math.PI;
    if(ent.length===1){ out+=`<circle cx="100" cy="100" r="${(R+r)/2}" style="fill:none;stroke:${col};stroke-width:${R-r}" data-tip="${esc(k)}: ${v}"></circle>`; return; }
    const s=a+gap/2, e=a+ang-gap/2; a+=ang;
    if(e<=s) return;
    const P=(rad,t)=>[100+rad*Math.cos(t),100+rad*Math.sin(t)];
    const [x1,y1]=P(R,s),[x2,y2]=P(R,e),[x3,y3]=P(r,e),[x4,y4]=P(r,s), L=e-s>Math.PI?1:0;
    out+=`<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${L} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${x3.toFixed(2)},${y3.toFixed(2)} A${r},${r} 0 ${L} 0 ${x4.toFixed(2)},${y4.toFixed(2)} Z" style="fill:${col}" data-tip="${esc(k)}: ${v} (${vn(v/total*100)}%)"></path>`;
  });
  return out;
}

function autoIcon(j){

  if(/thu hoi/.test(m)) return ["📥","Thu hồi"];

async function shrinkImage(file){

  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));

}

// ---------- xem nhanh khi trỏ chuột ----------
const peek=document.createElement("div"); peek.className="peek"; peek.hidden=true; ROOT.querySelector(".gvroot").appendChild(peek);
let peekId=null, peekShowT=0, peekHideT=0;
function showPeek(card){
  const j=jobs.find(x=>x.id===card.dataset.peek); if(!j) return;
  peekId=j.id; peek.innerHTML=cardHtml(j); peek.hidden=false;
  const r=card.getBoundingClientRect(), w=peek.offsetWidth, h=peek.offsetHeight, gap=8;
  let x=r.right+gap, y=r.top; if(x+w>innerWidth-8) x=r.left-gap-w;
  if(x<8){ x=Math.max(8,Math.min(r.left,innerWidth-w-8)); y=r.bottom+gap; }
  y=Math.max(8,Math.min(y,innerHeight-h-8));
  peek.style.left=x+"px"; peek.style.top=y+"px";
}
function hidePeek(now){ clearTimeout(peekShowT); clearTimeout(peekHideT); if(now){ peek.hidden=true; peekId=null; } else peekHideT=setTimeout(()=>{ peek.hidden=true; peekId=null; },180); }
ROOT.addEventListener("pointerover",e=>{
  if(e.pointerType && e.pointerType!=="mouse") return;
  const c=e.target.closest?.("[data-peek]");
  if(c){ clearTimeout(peekHideT); if(peekId!==c.dataset.peek){ clearTimeout(peekShowT); peekShowT=setTimeout(()=>showPeek(c),220); } return; }
  if(e.target.closest?.(".peek")){ clearTimeout(peekHideT); clearTimeout(peekShowT); return; }
  clearTimeout(peekShowT); if(!peek.hidden) hidePeek();
});

  { const om=ROOT.querySelector(".csmenu"); if(om&&!e.target.closest(".csmenu")) om.remove(); }

  try{ [assets,dl]=await Promise.all([window.claude.use("assets"),window.claude.use("downloads")]); }catch(_){}

  try{ const u=await window.claude.use("user"); const c=u? await u.can("data.write"):null; if(c===false){ roBase=true; readOnly=true; notice("Bạn đang xem ở quyền chỉ đọc. Nhờ chủ bảng mời quyền Editor để giao/cập nhật việc."); } }catch(_){}
  db.doc("config/gvcols").onSnapshot(s=>{ const d=s.exists?s.data():{}; colCfg={labels:d.labels||{},colors:d.colors||{}}; if(view!=="lists") render(); },()=>{});
  db.doc("config/danhmuc").onSnapshot(s=>{

  },()=>notice("Mất kết nối dữ liệu. Tải lại trang để tiếp tục."));
})();

  setMachines:l=>{ machines=l; machinesAt=new Date().toISOString(); fillMachineList(); showMachineInfo(); if(!$("#drawer").hidden){ renderItems(); snCheck(); } } };
return API;
};

.topbar .hello{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bell{position:relative}
.bell em{position:absolute;top:-3px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--out);color:#fff;font:700 10.5px/17px var(--f-body);text-align:center;font-style:normal;padding:0 4px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
#app{padding-block:18px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start;max-width:1500px;width:100%}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead h1{font-size:20px;margin:0;font-weight:700;flex:1;min-width:0;text-wrap:balance}
.phead .pact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phead .avatar,.phead .hello{display:none}
.lift,.wrap.lift{display:grid;gap:14px}
.selbox{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 4px 0 10px;height:36px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.selbox select{border:0;background:transparent;color:var(--fg);font-weight:600;height:34px;padding-right:4px;outline:none}
.selbox.on{color:var(--accent);border-color:var(--accent);font-weight:600;padding-right:10px}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--muted);flex:none;font-size:15px;line-height:1}
.ib svg{width:17px;height:17px}.ib:hover{color:var(--accent);border-color:var(--accent)}.ib:disabled{opacity:.4;pointer-events:none}
/* dashboard */
.dash{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
.dash .col{display:grid;gap:14px;align-content:start;min-width:0}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:10px}
.card.grow{flex:1}
.card>.lbl-it,.card>p{margin:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch h2,.card h2,.cardhead h2{font-size:15.5px;font-weight:700;margin:0}
.chact{display:flex;gap:6px}.chact .ib{border-color:transparent}
.balcard{border-radius:var(--r);padding:16px 18px;color:#fff;background:linear-gradient(110deg,var(--grad1),var(--grad2));display:grid;gap:2px}
.balcard small{opacity:.9;font-size:13px}.balcard b{font-size:24px;font-weight:800;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.balcard .eye{color:#fff;opacity:.9}
.eye{border:0;background:none;color:var(--muted);padding:2px;display:inline-grid}.eye svg{width:20px;height:20px}
.blur{filter:blur(8px);user-select:none}
.ovbars{height:130px;display:flex;justify-content:center;align-items:flex-end;gap:34px;margin:6px 0 2px}
.ovbars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:12.5px;color:var(--muted)}
.ovbars i{flex:none}
.ovbars i{display:block;width:26px;border-radius:4px 4px 0 0;min-height:2px}
.kv{display:grid;gap:8px}.kv div{display:flex;justify-content:space-between;gap:10px}.kv .tot{border-top:1px solid var(--line);padding-top:8px}.kv b{white-space:nowrap}
.emp{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--muted);padding:22px 8px;text-align:left}
.donutwrap{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center}
.donutwrap svg{width:120px;height:120px}
.dleg{display:grid;gap:6px;font-size:13px;min-width:0}
.dleg div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center}
.dleg i{width:10px;height:10px;border-radius:2px}.dleg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.tx:last-of-type{border-bottom:0}
.tx .ti{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tx .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700;white-space:nowrap}.tx.c .amt{color:var(--out)}.tx.t .amt{color:var(--in)}
.cico{width:38px;height:38px;border-radius:10px;background:var(--tile);display:grid;place-items:center;font-size:20px;line-height:1;flex:none}
.more{display:block;text-align:center;padding:6px;font-weight:600;text-decoration:none}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--accent);margin-right:4px}
.chip.p{background:var(--sunk);color:var(--muted)}
/* calendar */
.calnav{display:flex;align-items:center;justify-content:center;gap:6px}.calnav b{min-width:180px;text-align:center;font-size:15px}.calnav .ib{border-color:transparent}
.calsum2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--head);border-radius:8px;padding:8px;text-align:center}
.calsum2>div+div{border-left:1px solid var(--line)}.calsum2 small{display:block;color:var(--muted)}.calsum2 b{font-size:14px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.calgrid .ch2{background:var(--head);text-align:center;padding:6px 0;font-size:12.5px;color:var(--muted);font-weight:600}.calgrid .sun{color:var(--out)}
.cc{min-height:62px;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface);padding:4px 6px;display:flex;flex-direction:column;align-items:stretch;text-align:right;font-size:11.5px;min-width:0;overflow:hidden}
.calgrid>*:nth-child(7n+1){border-left:0}
.cc .d{text-align:left;font-weight:600;font-size:12.5px;margin-bottom:auto}.cc.out{background:var(--sunk)}.cc.out .d{color:var(--muted);font-weight:400}
.cc .i{color:var(--in)}.cc .o{color:var(--out)}.cc.sun .d{color:var(--out)}
.cc.today .d{color:var(--accent)}.cc.today{box-shadow:inset 0 0 0 2px var(--accent)}
button.cc:hover{background:var(--soft)}
.tabs3{display:flex;border-bottom:1px solid var(--line)}
.tabs3 button{flex:1;border:0;background:none;padding:9px 6px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs3 button.on{color:var(--accent);border-color:var(--accent)}
.tabs3.left button{flex:0 0 auto;padding:9px 16px}
.acclist{display:grid;gap:8px;overflow:auto;max-height:420px}
.accrow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;border:0;background:var(--soft);border-radius:10px;padding:10px;text-align:left;width:100%}
.accrow b{display:block}.accrow .num{font-size:13px}
.wi2{width:40px;height:30px;border-radius:6px;background:#36b5f0;color:#fff;display:grid;place-items:center;font-weight:800}
/* tables */
.card.wide{gap:12px}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.srch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:0 10px;height:36px;min-width:min(260px,100%);flex:0 1 300px}
.srch svg{width:17px;height:17px;color:var(--muted)}.srch input{border:0;background:transparent;outline:none;flex:1;min-width:0}
.tsum{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tsum .vl{width:1px;height:16px;background:var(--line)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.lt{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
.lt th{background:var(--head);text-align:left;font-weight:700;padding:10px 12px;white-space:nowrap}
.lt td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:middle}
.lt th.num,.lt td.num{text-align:right}
.lt tr.grp td{background:var(--surface);cursor:pointer}.lt tr.grp b{color:var(--accent);font-size:14.5px}
.lt tr.grp .num div{font-weight:700;font-size:13px;line-height:1.3}
.caret{display:inline-block;width:18px;color:var(--muted);transition:transform .15s}.caret.cl{transform:rotate(-90deg)}
.lt tr.it{cursor:pointer}.lt tr.it:hover td{background:var(--sunk)}
.lt td.ic{width:52px;padding-left:34px;padding-right:0}.lt td.ic .cico{width:28px;height:28px;font-size:16px;border-radius:7px}
.lt td small{display:block;color:var(--muted);font-size:12px}.lt td small.tag{color:var(--warn)}
.lt td.dg{color:var(--muted);max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt td.acts{white-space:nowrap;text-align:right;width:1%}.lt td.acts .ib{border-color:transparent;width:30px;height:30px}
.wchip{display:inline-grid;place-items:center;width:22px;height:16px;border-radius:3px;background:#36b5f0;color:#fff;font-size:10px;font-weight:800;margin-right:6px;vertical-align:-2px}
.stt{background:#e1f5ea;color:#12804a;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px}
.lnk{border:0;background:none;padding:0;text-align:left}
.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.pager select{border:1px solid var(--line);border-radius:7px;padding:4px;background:var(--surface)}
.pager .ib{width:30px;height:30px;border-color:transparent}
/* legacy page pieces reused */
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0}
.sect{font-size:17px;font-weight:700;margin:4px 0 0}
.sumlist{display:grid;gap:8px}.sumlist div{display:flex;justify-content:space-between;gap:8px;font-size:15px}.sumlist b{white-space:nowrap}.sumlist .tot{border-top:1px solid var(--line);padding-top:8px}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:center}
.bar .row{display:flex;justify-content:space-between;gap:8px}.bar .row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:600}
.track{height:7px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:5px}.track i{display:block;height:100%;background:var(--out);border-radius:99px}
.track.in i{background:var(--in)}.track.ok i{background:var(--accent)}.track.near i{background:var(--warn)}.track.over i{background:var(--out)}
.barbtn{background:none;border:0;padding:0;text-align:left;width:100%;min-width:0}
.kids{margin-top:6px;display:grid;gap:4px;font-size:12.5px;color:var(--muted)}.kids div{display:flex;justify-content:space-between}
.periodbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.periodbar select{border:1px solid var(--line);background:var(--surface);border-radius:9px;height:36px;padding:0 10px;font-weight:600}
.periodbar .ic{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:9px;font-size:17px}
.periodbar .lbl{font-weight:700;min-width:120px;text-align:center}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tools input,.tools select{border:1px solid var(--line);background:var(--surface);border-radius:9px;height:38px;padding:0 10px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 16px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.out{border-color:var(--accent);color:var(--accent)}
.btn.dan{color:var(--out);border-color:var(--out)}
.btn:disabled{opacity:.5;cursor:default}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:12.5px}
.mini.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
.note{font-size:12.5px;color:var(--muted)}
.banner{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px}.banner.err{background:#fde4e2}
.chart{width:100%;overflow-x:auto}.chart svg{display:block;min-width:540px;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}table.t th{color:var(--muted);font-weight:600;font-size:12.5px}table.t td.r,table.t th.r{text-align:right}
.catrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.catrow b{flex:1 1 140px;min-width:0}.catrow .k{font-size:12.5px;color:var(--muted);flex-basis:100%;padding-left:48px}
.budin{width:130px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);text-align:right}
.lbl-it{font-style:italic;color:var(--muted);font-size:15px}
.fin{display:block;background:linear-gradient(110deg,var(--grad1),var(--grad2));color:#fff;border-radius:var(--r);padding:16px;text-align:center;text-decoration:none}
.fin .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;text-align:left}.fin .two div{background:rgba(255,255,255,.18);border-radius:10px;padding:10px;min-width:0}.fin .two small{display:block;opacity:.9}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.cal .h{text-align:center;color:var(--muted);font-size:12.5px;padding:4px 0}
.cal button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:56px;padding:3px 4px;display:flex;flex-direction:column;align-items:stretch;font-size:10.5px;text-align:right;min-width:0;overflow:hidden}
.cal button .d{color:var(--muted);font-size:11.5px;text-align:left;margin-bottom:auto}.cal .o{color:var(--out);font-weight:600}.cal .i{color:var(--in);font-weight:600}.cal button.today{border-color:var(--accent);border-width:2px}.cal .blank{visibility:hidden}
.calsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 4px;gap:4px}.calsum small{color:var(--muted);display:block;font-size:12.5px}
.tiles2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile2{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;text-decoration:none;color:var(--fg);font-weight:600}.tile2 svg{width:26px;height:26px;color:var(--accent)}
.mini5{display:flex;align-items:flex-end;gap:14px;height:86px}.mini5 div{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted)}.mini5 i{width:12px;background:var(--out);border-radius:3px;display:block}
.todo{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.todo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.todo small{display:block;color:var(--muted);font-size:12.5px}
.todor{display:grid;justify-items:end;gap:5px}.todoact{grid-column:2/-1;display:flex;gap:6px;justify-content:flex-end}
.ctrow{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}.ctrow small{display:block;color:var(--muted);font-size:12.5px}
.featcard{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;text-decoration:none;color:var(--fg)}
.menurow{display:flex;align-items:center;gap:12px;padding:10px 4px;font-weight:600}
.menu{display:grid}.menu button{display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-weight:600;width:100%}.menu small{display:block;color:var(--muted);font-weight:400}
/* modal */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:14px;padding:18px 20px;display:grid;gap:12px;align-content:start;grid-template-columns:minmax(0,1fr);box-shadow:0 24px 60px rgba(10,30,60,.25)}
.sheet.form{max-width:780px}.sheet.wide{max-width:860px}.sheet.full{max-width:620px;height:88vh}
.shead{display:flex;align-items:center;gap:12px}.shead h3{margin:0;font-size:17px;font-weight:700;flex:1}.shead .ib{border-color:transparent}
.back{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:17px;flex:none}
.ftabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.ftabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.ftabs button.on{color:var(--accent);border-color:var(--accent)}.ftabs button:disabled{opacity:.4}
.fgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 18px}
.fcol{display:grid;gap:12px;align-content:start}
.f{display:grid;gap:5px}.f label{font-size:13px;font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.f textarea{resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amtbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding-right:10px}.amtbox:focus-within{border-color:var(--accent)}
.amtin{border:0!important;font-size:20px;font-weight:700;text-align:right;outline:none;background:transparent}
.amtbox span{color:var(--muted);font-weight:700}
.quick{display:flex;gap:5px;flex-wrap:wrap;margin-top:-6px}.quick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 10px;font-size:12.5px}
.pickf{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);min-height:42px;text-align:left;width:100%}
.pickf .cico{width:28px;height:28px;font-size:16px;border-radius:7px}.pickf span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pickf i{color:var(--muted)}.pickf b{color:var(--muted);font-size:12px}
.qcats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.qcats button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 8px 3px 3px;font-size:12.5px}
.qcats button .cico{width:22px;height:22px;font-size:13px;border-radius:5px}.qcats button.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.phbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;min-height:96px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;background:var(--sunk)}
.phbox.drag{border-color:var(--accent);background:var(--soft)}
.ph{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:22px;padding:0;cursor:pointer}
.ph.up::after{content:'Đang tải…';position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.7);font-size:11.5px;color:#334155}
.phadd{aspect-ratio:1;border-radius:9px;border:1px dashed var(--muted);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;background:var(--surface);padding:4px;line-height:1.3}
.phadd b{display:block;font-size:22px;font-weight:400;color:var(--accent)}

<script>
/* ---------- Sổ thu chi (kiểu MISA web) · chỉ chủ sở hữu ---------- */
window.mountTC=function(ROOT,HOST){
const CP=b=>'thuchi';
const EVT=ROOT;const ROOTQ=s=>ROOT.querySelector(s);const ROOTQ_all=s=>ROOT.querySelectorAll(s);const ROOTQ_active=()=>ROOT.activeElement;const ROOTQ_contains=()=>true;const scrollTopApp=()=>{try{HOST.scrollIntoView({block:'start'})}catch(e){}};const TCR=()=>ROOT.querySelector('.tcroot');
function needXLSX(){if(window.XLSX)return Promise.resolve();return new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)})}
const BOOKS={skylap:'SKYLAP',canhan:'Cá nhân'};
const VAYNO=[{p:'Cho vay',k:'c'},{p:'Trả nợ',k:'c'},{p:'Đi vay',k:'t'},{p:'Thu nợ',k:'t'}];
const VN_NAMES=VAYNO.map(v=>v.p);
const ROUTES=['tong-quan','tai-khoan','bao-cao','so','ngan-sach','hang-muc','excel','bc-chi','bc-thu','bc-vayno','bc-doituong','bc-sukien','bc-taichinh','hop-dong','dinh-ky','giao-dien'];
const S={db:null,user:null,owner:false,uid:null,name:'',ready:false,err:'',
  data:{skylap:{meta:null,months:{}},canhan:{meta:null,months:{}}},
  book:'skylap',mode:'m',cur:new Date(),ov:'month',tab:'tong-quan',q:'',fCat:'',fType:'',fWallet:'',openCat:{},hide:false,rk:'c',anaN:6,theme:'',fDay:'',acctClosed:false};
try{const b=localStorage.getItem('tc_book');if(b)S.book=b;const m=localStorage.getItem('tc_mode');if(m)S.mode=m;S.hide=localStorage.getItem('tc_hide')==='1';const o=localStorage.getItem('tc_ov');if(o)S.ov=o;S.theme=localStorage.getItem('tc_theme')||'';S.anaN=+(localStorage.getItem('tc_ana')||6);S.mini=localStorage.getItem('tc_mini')==='1'}catch(e){}
function applyTheme(){const t=S.theme||document.documentElement.getAttribute('data-theme')||'';if(t)HOST.setAttribute('data-theme',t);else HOST.removeAttribute('data-theme')}applyTheme();try{new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
const $=s=>ROOT.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('vi-VN');
const money=n=>`<span class="${S.hide?'blur':''}">${fmt(n)} đ</span>`;
const short=n=>{const a=Math.abs(n);if(a>=1e9)return (n/1e9).toFixed(a>=1e10?0:1).replace('.',',')+' tỷ';if(a>=1e6)return (n/1e6).toFixed(a>=1e8?0:1).replace('.',',')+' tr';if(a>=1e3)return Math.round(n/1e3)+'k';return String(n)};
const pad=n=>String(n).padStart(2,'0');
const ymOf=d=>d.slice(0,7);
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const vnDate=iso=>{const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y};
const DOW=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const HOLDER='h'+Math.random().toString(36).slice(2);
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;(TCR()||ROOT).appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- icons for categories ---------- */
const ICONS=[[/ăn sáng/,'🍩'],[/ăn trưa/,'🍜'],[/ăn tối/,'🥩'],[/cafe|cà phê/,'☕'],[/chợ|siêu thị/,'🛍️'],[/ăn tiệm|nhà hàng/,'🍲'],[/ăn uống/,'🍎'],
 [/đồ chơi/,'🧸'],[/học phí/,'🎓'],[/sách vở/,'📚'],[/sữa/,'🍼'],[/tiêu vặt/,'🪙'],[/con cái/,'🧒'],
 [/laptop/,'💻'],[/\bpc\b|máy tính/,'🖥️'],[/linh kiện/,'🔩'],[/sửa ch/,'🛠️'],[/ship|giao hàng/,'🚚'],[/lương/,'💵'],[/kế toán/,'🧾'],[/điện nước/,'💡'],[/thuê nhà/,'🏢'],[/rác/,'🗑️'],[/quảng cáo/,'📣'],[/đồ dùng/,'🧴'],[/chi phí skylap/,'📦'],
 [/bảo hiểm/,'🛡️'],[/xăng/,'⛽'],[/taxi|thuê xe/,'🚕'],[/rửa xe/,'🧽'],[/gửi xe/,'🅿️'],[/bảo dưỡng xe/,'🔧'],[/đi lại/,'🛵'],
 [/điện thoại/,'📱'],[/internet/,'🌐'],[/^điện$/,'⚡'],[/^nước$/,'🚰'],[/giúp việc/,'🧹'],[/sinh hoạt/,'🏠'],
 [/thuốc/,'💊'],[/khám/,'🩺'],[/sức khỏe/,'❤️'],[/cưới/,'💍'],[/ma chay/,'🕯️'],[/biếu|tặng|hiếu hỉ/,'🎁'],
 [/vàng/,'🪙'],[/ngân hàng/,'🏦'],[/sửa chữa nhà/,'🔨'],[/đồ đạc/,'🛋️'],[/nhà cửa/,'🏡'],[/giầy|giày/,'👟'],[/quần áo/,'👕'],[/trang phục/,'👔'],
 [/làm đẹp/,'💅'],[/mỹ phẩm/,'💄'],[/vui chơi|giải trí/,'🎡'],[/hưởng thụ/,'🌴'],[/giao lưu|quan hệ/,'🤝'],[/phát triển/,'📈'],[/dịch vụ/,'🧰'],
 [/doanh thu|thuê máy/,'💰'],[/thanh lý|bán máy/,'🏷️'],[/góp vốn/,'📥'],[/công nợ/,'📒'],[/thưởng/,'🏆'],[/lãi/,'📈'],[/^lương$/,'💵'],
 [/cho vay/,'📤'],[/đi vay/,'📥'],[/trả nợ/,'💸'],[/thu nợ/,'💰'],[/khác/,'📦']];
const iconDef=(c,s)=>{const t=((s||'')+'').toLowerCase();const p=((c||'')+'').toLowerCase();for(const [rx,e] of ICONS)if(t&&rx.test(t))return e;for(const [rx,e] of ICONS)if(rx.test(p))return e;return '📁'};
const IMGRX=/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/;
const uiMeta=()=>{const d=S.data&&S.data.skylap;return (d&&d.meta)||{}};
const customIco=(c,s)=>{const m=uiMeta().icons||{};const v=(s&&m[s])||m[c]||'';return typeof v==='string'&&(IMGRX.test(v)||v.length<=16)?v:''};
const iconOf=(c,s)=>customIco(c,s)||iconDef(c,s);
const icoInner=v=>IMGRX.test(v)?`<img src="${esc(v)}" alt="">`:esc(v);
const ico=(c,s)=>`<span class="cico" aria-hidden="true" data-ik="1" data-ic="${esc(c||'')}" data-is="${esc(s||'')}">${icoInner(iconOf(c,s))}</span>`;

/* ---------- data access ---------- */
function booksVisible(){return ['skylap']}
function activeBooks(){return S.book==='all'?booksVisible():[S.book]}
function allItems(books){const out=[];for(const b of books){const ms=S.data[b].months;for(const k in ms)for(const it of ms[k])out.push(Object.assign({b},it))}return out}
function inPeriod(it){const c=S.cur;if(S.mode==='a')return true;if(S.mode==='y')return it.d.slice(0,4)==String(c.getFullYear());return ymOf(it.d)===c.getFullYear()+'-'+pad(c.getMonth()+1)}
function periodLabel(){const c=S.cur;if(S.mode==='a')return 'Toàn bộ';if(S.mode==='y')return 'Năm '+c.getFullYear();return 'Tháng '+pad(c.getMonth()+1)+'/'+c.getFullYear()}
function ovRange(){const n=new Date();let a,b=todayISO();
  if(S.ov==='day')a=b;else if(S.ov==='week'){const d=new Date(n);d.setDate(d.getDate()-((d.getDay()+6)%7));a=isoOf(d)}
  else if(S.ov==='month')a=isoOf(new Date(n.getFullYear(),n.getMonth(),1));else if(S.ov==='lastmonth'){a=isoOf(new Date(n.getFullYear(),n.getMonth()-1,1));b=isoOf(new Date(n.getFullYear(),n.getMonth(),0))}
  else if(S.ov==='quarter')a=isoOf(new Date(n.getFullYear(),Math.floor(n.getMonth()/3)*3,1));else a=n.getFullYear()+'-01-01';return [a,b]}
function sortDesc(a,b){return (b.d+b.t).localeCompare(a.d+a.t)||b.id.localeCompare(a.id)}
function meta(b){return S.data[b].meta||{cats:{chi:[{p:'Khác',ch:[]}],thu:[{p:'Khác',ch:[]}]},wallets:[{name:'Tiền mặt',open:0}],budgets:{}}}
function keyOf(it){return [it.d,it.t,it.k,Math.round(it.a),(it.c||'').trim(),(it.s||'').trim(),(it.n||'').trim()].join('|')}
async function withLease(ref){for(let i=0;i<8;i++){try{const r=await ref.acquire({holder:HOLDER,ttlMs:8000});if(r.acquired)return;}catch(e){return}await new Promise(r=>setTimeout(r,400+Math.random()*600))}}
async function mutateDoc(path,fn,empty){const ref=S.db.doc(path);await withLease(ref);const snap=await ref.get();const cur=snap.exists?JSON.parse(JSON.stringify(snap.data())):JSON.parse(JSON.stringify(empty));await ref.set(fn(cur))}
const mutateMonth=(b,ym,fn)=>mutateDoc(CP(b)+'/m-'+ym,d=>{d.ym=ym;d.items=fn(d.items||[]);return d},{ym,items:[]});
const mutateMeta=(b,fn)=>mutateDoc(CP(b)+'/meta',fn,meta(b));
function wrapErr(e){const c=e&&e.code;if(c==='invalid_argument')return 'Bạn không có quyền ghi vào sổ này.';if(c==='quota_exceeded')return 'Bộ nhớ của app đã đầy: '+(e.message||'');return 'Không lưu được, thử lại sau. ('+(c||e)+')'}
async function saveTx(b,it,old){it.by=it.by||S.uid||'';it.ts=it.ts||Date.now();
  if(old&&(old.b!==b||ymOf(old.d)!==ymOf(it.d))){await mutateMonth(b,ymOf(it.d),items=>{items.push(it);return items});await mutateMonth(old.b,ymOf(old.d),items=>items.filter(x=>x.id!==old.id))}
  else await mutateMonth(b,ymOf(it.d),items=>{const i=items.findIndex(x=>x.id===it.id);if(i>=0)items[i]=it;else items.push(it);return items})}
async function deleteTx(old){await mutateMonth(old.b,ymOf(old.d),items=>items.filter(x=>x.id!==old.id))}
function rawTot(items){let t=0,c=0;for(const i of items){if(i.k==='t')t+=i.a;else c+=i.a}return {t,c,n:t-c}}
function totals(items){let t=0,c=0;for(const i of items){if(i.nr)continue;if(i.k==='t')t+=i.a;else c+=i.a}return {t,c,n:t-c}}
function balances(books){const out=[];for(const b of books||activeBooks()){const m=meta(b);const items=allItems([b]);const names=new Set(m.wallets.map(w=>w.name));
  for(const w of m.wallets){const x=rawTot(items.filter(i=>i.w===w.name));out.push({b,name:w.name,open:+w.open||0,bal:(+w.open||0)+x.n})}
  const orphan=items.filter(i=>!names.has(i.w));if(orphan.length){const x=rawTot(orphan);out.push({b,name:'(Ví khác)',open:0,bal:x.n,orphan:true})}}return out}

/* ---------- boot ---------- */
async function boot(){
  render();
  try{S.user=await window.claude?.use?.('user')}catch(e){}
  try{S.db=await window.claude?.use?.('db')}catch(e){}
  window.claude?.use?.('sample').then(x=>{S.sample=x||null}).catch(()=>{});
  if(S.user){try{S.owner=!!(await S.user.isOwner())}catch(e){}try{const me=await S.user.me();S.uid=me.id;S.name=me.name||''}catch(e){}}
  S.book='skylap';
  if(!S.db){S.err='Không kết nối được cơ sở dữ liệu. Hãy đăng nhập claude.ai để mở sổ.';S.ready=true;render();return}
  const timer=setTimeout(()=>{if(!S.ready){S.ready=true;S.err='Chưa tải được dữ liệu, đang thử lại…';render()}},10000);
  let pending=booksVisible().length;
  for(const b of booksVisible()){let first=true;
    S.db.collection(CP(b)).onSnapshot(snap=>{const months={};let m=null,ct=[],rc={list:[],skips:[]};
      for(const d of snap.docs){const v=d.data();if(d.id==='meta')m=v;else if(d.id==='contracts')ct=v.list||[];else if(d.id==='recurring')rc=v;else if(d.id==='uibg'){if(b==='skylap')S.uibg=typeof v.img==='string'&&IMGRX.test(v.img)?v.img:''}else if(d.id.startsWith('m-'))months[d.id.slice(2)]=v.items||[]}
      S.data[b]={meta:m,months,contracts:ct,recurring:rc};
      if(first&&!snap.metadata.fromCache){first=false;if(--pending<=0){S.ready=true;clearTimeout(timer);if(S.err.startsWith('Chưa'))S.err=''}}
      if(!S.ready&&Object.keys(months).length)S.ready=true;
      render()},e=>{clearTimeout(timer);S.ready=true;S.err='Lỗi tải sổ '+BOOKS[b]+': '+(e.code||'');render()})}

function fileImg(f,max,square){return new Promise((ok,no)=>{if(!f||!/^image\//.test(f.type)){no(new Error('Hãy chọn file ảnh'));return}const fr=new FileReader();fr.onerror=()=>no(new Error('Không đọc được ảnh'));fr.onload=()=>{const im=new Image();im.onerror=()=>no(new Error('File không phải ảnh'));im.onload=()=>{const c=document.createElement('canvas');let w=im.width,h=im.height,sx=0,sy=0,sw=w,sh=h;
  if(square){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=max}else{const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r)}
  c.width=w;c.height=h;const g=c.getContext('2d');if(!square){g.fillStyle='#fff';g.fillRect(0,0,w,h)}g.drawImage(im,sx,sy,sw,sh,0,0,w,h);
  if(square){let u=c.toDataURL('image/png');if(u.length>60000)u=c.toDataURL('image/jpeg',.85);ok(u);return}
  let q=.82,u=c.toDataURL('image/jpeg',q);while(u.length>700000&&q>.4){q-=.1;u=c.toDataURL('image/jpeg',q)}ok(u)};im.src=fr.result};fr.readAsDataURL(f)})}

/* ---------- hợp đồng thuê, công nợ, khoản định kỳ ---------- */
const CT_CAT='Doanh thu cho thuê máy';
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const contractsOf=()=>S.data.skylap.contracts||[];
const recOf=b=>S.data[b].recurring||{list:[],skips:[]};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00');d.setDate(d.getDate()+n);return isoOf(d)};
const dueOf=(per,day)=>{const [y,m]=per.split('-').map(Number);const last=new Date(y,m,0).getDate();return per+'-'+pad(Math.min(Math.max(1,+day||1),last))};
const perAdd=(per,n)=>{const [y,m]=per.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const perVN=per=>per.slice(5)+'/'+per.slice(0,4);
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
function paidMap(field){const m={};for(const i of allItems(booksVisible()))if(i[field]&&i.per){const k=i[field]+'|'+i.per;m[k]=(m[k]||0)+i.a}return m}
function receivables(){
  if(!activeBooks().includes('skylap'))return [];
  const today=todayISO(),horizon=addDays(today,7),out=[];const paid=paidMap('ct');
  for(const c of contractsOf()){if(c.active===false)continue;let per=ymOf(c.start||today);if(c.from&&c.from>per)per=c.from;let guard=0;
    while(guard++<120){const due=dueOf(per,c.day);if(due>horizon)break;if(c.end&&due>c.end)break;
      if(due>=(c.start||'0000')){const got=paid[c.id+'|'+per]||0;const rem=(+c.price||0)-got;if(rem>0)out.push({c,per,due,got,rem,late:daysBetween(due,today)})}
      per=perAdd(per,1)}}
  return out.sort((a,b)=>a.due.localeCompare(b.due))}
function monthReceivable(){const per=ymOf(todayISO());const paid=paidMap('ct');let exp=0,got=0;
  for(const c of contractsOf()){if(c.active===false)continue;const due=dueOf(per,c.day);if((c.start||'0000')>due||(c.end&&due>c.end))continue;exp+=+c.price||0;got+=Math.min(+c.price||0,paid[c.id+'|'+per]||0)}return {exp,got}}
function pendingRec(){
  const today=todayISO(),out=[];
  for(const b of activeBooks()){if(!(b==='skylap'||S.owner))continue;const R=recOf(b);const done=paidMap('rc');const skips=new Set(R.skips||[]);
    for(const r of R.list||[]){if(r.active===false)continue;let per=r.start&&r.start>perAdd(ymOf(today),-2)?r.start:perAdd(ymOf(today),-2);
      for(let g=0;g<4&&per<=ymOf(today);g++,per=perAdd(per,1)){const due=dueOf(per,r.day);if(due>today)continue;if(r.start&&per<r.start)continue;const k=r.id+'|'+per;if(done[k]||skips.has(k))continue;out.push({b,r,per,due})}}}
  return out.sort((a,b)=>a.due.localeCompare(b.due))}
function recSuggest(b){
  const R=recOf(b);const have=new Set((R.list||[]).map(r=>r.c+'|'+(r.s||'')));const cut=perAdd(ymOf(todayISO()),-6);const g={};
  for(const i of allItems([b])){if(ymOf(i.d)<cut||VN_NAMES.includes(i.c))continue;const k=i.k+'|'+i.c+'|'+(i.s||'');const x=g[k]||(g[k]={months:new Set(),last:null,days:[]});x.months.add(ymOf(i.d));x.days.push(+i.d.slice(8));if(!x.last||i.d>x.last.d)x.last=i}
  return Object.entries(g).filter(([k,x])=>x.months.size>=4&&!have.has(k.split('|').slice(1).join('|'))).map(([k,x])=>{const [kk,c,s]=k.split('|');const days=x.days.sort((a,b)=>a-b);return {k:kk,c,s,a:x.last.a,day:Math.min(28,days[Math.floor(days.length/2)]),w:x.last.w,n:'',name:s||c,months:x.months.size}}).sort((a,b)=>b.months-a.months).slice(0,8)}
const mutateContracts=fn=>mutateDoc(CP('skylap')+'/contracts',d=>{d.list=fn(d.list||[]);return d},{list:[]});
const mutateRec=(b,fn)=>mutateDoc(CP(b)+'/recurring',d=>{d.list=d.list||[];d.skips=d.skips||[];return fn(d)},{list:[],skips:[]});
function collect(x){openForm(null,{b:'skylap',k:'t',c:CT_CAT,s:'',a:x.rem,who:x.c.cust,n:`Tiền thuê T${perVN(x.per)}${x.c.machines?' · '+x.c.machines:''}`,w:x.c.w||'',d:todayISO()>x.due?todayISO():x.due,ct:x.c.id,per:x.per})}
async function quickRec(p){try{await saveTx(p.b,{id:newId('r'),d:p.due,t:'08:00',k:p.r.k,a:+p.r.a||0,c:p.r.c,s:p.r.s||'',w:p.r.w||'',n:p.r.n||p.r.name,who:p.r.who||'',ev:'',rc:p.r.id,per:p.per});toast('Đã ghi '+p.r.name+' '+fmt(p.r.a)+' đ')}catch(e){toast(wrapErr(e))}}

  ${pr.length>4?`<a class="more" href="#dinh-ky">Xem tất cả ${pr.length} khoản định kỳ</a>`:''}</div>`}
function pgContracts(){
  if(!booksVisible().includes('skylap'))return pageBand('Hợp đồng thuê','khac')+'<div class="wrap lift"><div class="card empty">Không có quyền.</div></div>';
  const rv=receivables();S._rv=rv;const mr=monthReceivable();const late=rv.filter(x=>x.late>0);const can=true;
  const paid=paidMap('ct');const tot={};for(const k in paid){const id=k.split('|')[0];tot[id]=(tot[id]||0)+paid[k]}
  const list=contractsOf().slice().sort((a,b)=>(a.active===false)-(b.active===false)||a.cust.localeCompare(b.cust,'vi'));
  return pageBand('Hợp đồng thuê & công nợ','tong-quan')+`<div class="wrap lift">

/* ---------- ghi nhanh bằng AI ---------- */
async function toJpeg(file){try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));return bl||file}catch(e){return file}}
function catText(b){const m=meta(b);return ['chi','thu'].map(ty=>`  ${ty.toUpperCase()}: `+m.cats[ty].map(c=>c.ch.length?`${c.p} (con: ${c.ch.join(', ')})`:c.p).join('; ')).join('\n')+`\n  Ví: ${m.wallets.map(w=>w.name).join(', ')}`}
async function runAI(F,redraw){
  const msg=$('#aimsg');const txt=(F._aitxt||'').trim();if(!txt&&!F._img){msg.textContent='Gõ một câu hoặc chọn ảnh hoá đơn trước.';return}
  const btn=$('#aigo');btn.disabled=true;btn.textContent='Đang đọc…';msg.textContent=F._img?'Đang đọc ảnh, có thể mất 10–40 giây…':'Đang phân tích…';
  const books=booksVisible();
  const prompt=`Bạn là trợ lý ghi sổ thu chi tiếng Việt cho SKYLAP (công ty cho thuê máy tính)${books.length>1?' và sổ cá nhân của chủ công ty':''}. Hôm nay là ${todayISO()} lúc ${nowHM()}.
Đọc nội dung người dùng gõ${F._img?' và ảnh đính kèm (hoá đơn, biên lai, ảnh chụp màn hình chuyển khoản)':''}, rồi trả về DUY NHẤT một JSON:
{"book":"${books.join('" hoặc "')}","k":"c (chi) hoặc t (thu)","a":số tiền VND là số nguyên,"c":"hạng mục cha","s":"hạng mục con hoặc chuỗi rỗng","d":"YYYY-MM-DD","t":"HH:MM","n":"diễn giải ngắn gọn","who":"người/đơn vị nhận hoặc trả tiền, hoặc rỗng","w":"tên ví hoặc rỗng"}
Quy ước: 25k = 25000; 1tr5 = 1500000; 12tr = 12000000; 1 tỷ = 1000000000. Nếu không nói ngày thì dùng hôm nay; "hôm qua" = ngày trước hôm nay. Với ảnh chuyển khoản, lấy số tiền, thời gian và tên người nhận/người chuyển.
Chỉ chọn c và s từ danh sách dưới đây (giữ nguyên chữ). Khoản vay nợ dùng c là "Cho vay" hoặc "Trả nợ" (k=c), "Đi vay" hoặc "Thu nợ" (k=t).
${books.map(b=>`Sổ "${b}" (${BOOKS[b]}):\n${catText(b)}`).join('\n')}
${books.length>1?`Chi phí của công ty (máy tính, linh kiện, lương nhân viên, thuê văn phòng, ship máy...) và tiền khách trả thuê máy thuộc sổ "skylap". Chi tiêu gia đình, ăn uống, con cái thuộc sổ "canhan". Nếu không chắc thì chọn sổ "${F.b}".`:''}
Nội dung người dùng gõ: """${txt||'(không có, chỉ có ảnh)'}"""`;
  try{
    const opts={modelTier:F._img?'default':'quick'};if(F._img)opts.images=[await toJpeg(F._img)];
    const r=await S.sample.json(prompt,opts);
    if(!r||typeof r!=='object')throw {code:'invalid_json'};
    if(r.book&&books.includes(r.book))F.b=r.book;
    const m=meta(F.b);if(r.k==='t'||r.k==='c')F.k=r.k;
    const a=Math.round(+r.a||0);if(a>0)F.a=a;
    const ty=F.k==='t'?'thu':'chi';const vn=VAYNO.find(v=>v.p===r.c);
    if(vn){F.c=vn.p;F.s='';F.k=vn.k}else{const cat=m.cats[ty].find(c=>c.p===r.c);if(cat){F.c=cat.p;F.s=cat.ch.includes(r.s)?r.s:''}else{F.c='';F.s=''}}
    if(/^\d{4}-\d{2}-\d{2}$/.test(r.d||''))F.d=r.d;if(/^\d{1,2}:\d{2}$/.test(r.t||''))F.t=r.t.padStart(5,'0');
    if(r.n)F.n=String(r.n);if(r.who)F.who=String(r.who);if(r.w&&m.wallets.some(w=>w.name===r.w))F.w=r.w;else if(!m.wallets.some(w=>w.name===F.w))F.w='';
    F._img=null;F._aimsg=F.c?'✓ Đã điền. Kiểm tra lại rồi bấm Ghi.':'Đã điền số tiền, hãy chọn hạng mục.';redraw();
  }catch(e){btn.disabled=false;btn.textContent='Điền';const c=e&&e.code;msg.textContent=c==='not_granted'?'Bạn chưa cho phép app dùng Claude. Có thể nhập tay bình thường.':c==='rate_limited'?'Đang gửi quá nhiều, thử lại sau ít phút.':c==='image_rejected'||c==='images_unavailable'?'Không đọc được ảnh này, thử ảnh JPG/PNG khác.':'Không hiểu được nội dung, thử viết rõ hơn (vd: “chi 120k thuốc nhỏ mắt”).'}
}

    const m=meta(F.b);const ql=q.trim().toLowerCase();const match=s=>!ql||s.toLowerCase().includes(ql);

    if(tab==='v'){body=`<div class="pgroup"><div class="cgrid">${VAYNO.filter(v=>match(v.p)).map(v=>`<button class="cbtn ${F.c===v.p?'on':''}" data-pc="${esc(v.p)}" data-ps="" data-pk="${v.k}">${ico(v.p)}<span>${esc(v.p)}</span></button>`).join('')}</div><p class="note" style="margin-top:12px">Cho vay, Trả nợ được tính là khoản chi; Đi vay, Thu nợ được tính là khoản thu.</p></div>`}
    else{const ty=tab==='t'?'thu':'chi';const k=tab;const cats=m.cats[ty].filter(c=>!VN_NAMES.includes(c.p)).slice().sort((a,b)=>a.p.localeCompare(b.p,'vi'));
      const fr=ql?[]:frequent();
      if(fr.length)body+=`<div><div class="lbl-it">Hay dùng</div><div class="hscroll">${fr.map(([c,s])=>`<button class="cbtn ${F.c===c&&(F.s||'')===s?'on':''}" data-pc="${esc(c)}" data-ps="${esc(s)}" data-pk="${k}">${ico(c,s)}<span>${esc(s||c)}</span></button>`).join('')}</div></div>`;
      body+=cats.map(c=>{const kids=c.ch.filter(s=>match(s)||match(c.p));if(ql&&!match(c.p)&&!kids.length)return '';
        return `<div class="pgroup"><button class="ph ${F.c===c.p&&!F.s?'on':''}" data-pc="${esc(c.p)}" data-ps="" data-pk="${k}">${ico(c.p)}<b>${esc(c.p)}</b></button>${kids.length?`<div class="cgrid">${kids.map(s=>`<button class="cbtn ${F.c===c.p&&F.s===s?'on':''}" data-pc="${esc(c.p)}" data-ps="${esc(s)}" data-pk="${k}">${ico(c.p,s)}<span>${esc(s)}</span></button>`).join('')}</div>`:''}</div>`}).join('')||'<div class="empty">Không tìm thấy hạng mục.</div>';
      body+=`<div class="pgroup"><div class="tools" style="margin:0"><input id="pnew" placeholder="Thêm hạng mục ${ty} mới…"><button class="btn" id="pnewbtn">Thêm</button></div></div>`}
    layer(`<div class="shead"><button class="back" id="pback" aria-label="Quay lại">←</button><h3>Chọn hạng mục</h3></div>
    <div class="segtabs"><button data-ptab="c" class="${tab==='c'?'on':''}">Chi tiền</button><button data-ptab="t" class="${tab==='t'?'on':''}">Thu tiền</button><button data-ptab="v" class="${tab==='v'?'on':''}">Vay nợ</button></div>
    <label class="search">${SVG.search}<input id="pq" placeholder="Tìm kiếm theo tên hạng mục" value="${esc(q)}" aria-label="Tìm hạng mục"></label>${body}`,true);
    const pq=$('#pq');pq.addEventListener('input',()=>{q=pq.value;const pos=pq.selectionStart;draw();const n=$('#pq');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}});
    ROOT.querySelector('.sheet').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
      if(b.id==='pback'){done(null);return}
      if(b.dataset.ptab){tab=b.dataset.ptab;q='';draw();return}
      if(b.dataset.pc!==undefined){done({c:b.dataset.pc,s:b.dataset.ps||'',k:b.dataset.pk});return}
      if(b.id==='pnewbtn'){const v=$('#pnew').value.trim();if(!v)return;const ty=tab==='t'?'thu':'chi';try{await mutateMeta(F.b,mm=>{if(!mm.cats[ty].some(c=>c.p===v))mm.cats[ty].push({p:v,ch:[]});return mm});done({c:v,s:'',k:tab})}catch(err){toast(wrapErr(err))}}
    });
  }
  draw();
}

async function assetsApi(){if(S._as===undefined){try{S._as=(await window.claude?.use?.('assets'))||null}catch(e){S._as=null}}return S._as}
const phOk=p=>p&&typeof p.u==='string'&&/^(\/|https:|data:image\/)/.test(p.u);
async function uploadPhoto(f){const A=await assetsApi();const du=await fileImg(f,1600,false);
  if(!A)throw new Error('Trang chưa được cấp quyền lưu ảnh');
  const [h,b64]=du.split(','),bin=atob(b64),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  const r=await A.upload(new File([u8],'anh-chi-'+Date.now()+'.jpg',{type:'image/jpeg'}));return {u:r.url||('/_blob/'+r.id),id:r.id}}
async function dropPhotos(ids){if(!ids||!ids.length)return;const A=await assetsApi();if(!A)return;for(const id of ids){try{await A.delete(id)}catch(_){}}}
function viewPhotos(list,i){let k=i||0;const host=TCRX();const v=document.createElement('div');v.className='phview';v.setAttribute('role','dialog');

  v.addEventListener('click',e=>{e.stopPropagation();if(e.target.closest('.pv')){k=(k-1+list.length)%list.length;show();return}if(e.target.closest('.nx')){k=(k+1)%list.length;show();return}v.remove()});host.appendChild(v)}

/* ----- hộp Thêm ghi chép (kiểu MISA web) ----- */
function openForm(old,preset){
  const F=old?Object.assign({},old):Object.assign({id:newId('t'),b:'skylap',k:'c',a:0,c:'',s:'',d:todayISO(),t:nowHM(),w:'',n:'',who:'',ev:''},preset||{});
  F.b='skylap';let mode=old&&old.tf?'x':old&&old.c==='Điều chỉnh số dư'?'adj':(F.k==='t'?'t':'c');if(old&&old.tf){const o=allItems(['skylap']).find(x=>x.tf===old.tf&&x.id!==old.id);F._pair=o||null;if(old.k==='t'&&o){F.w2=old.w;F.w=o.w}else if(o)F.w2=o.w}
  F.ph=(Array.isArray(F.ph)?F.ph:[]).filter(phOk).map(p=>({...p}));const phAdded=[],phRemoved=[];let phBusy=0;

  function draw(){
    const m=meta('skylap');if(!F.w)F.w=(m.wallets[0]||{}).name||'';if(mode==='x'&&!F.w2)F.w2=((m.wallets.find(w=>w.name!==F.w))||{}).name||'';
    const wsel=(id,val)=>`<select id="${id}">${m.wallets.map(w=>`<option ${w.name===val?'selected':''}>${esc(w.name)}</option>`).join('')}${val&&!m.wallets.some(w=>w.name===val)?`<option selected>${esc(val)}</option>`:''}</select>`;
    const dt=`<div class="f"><label for="fdt">Thời gian *</label><input type="datetime-local" id="fdt" value="${F.d}T${F.t||'00:00'}"></div>`;
    const amt=lbl=>`<div class="f"><label for="fa">${lbl} *</label><div class="amtbox"><input class="amtin num" id="fa" inputmode="numeric" value="${F.a?fmt(F.a):''}" placeholder="0"><span>₫</span></div></div>`;
    const note=`<div class="f"><label for="fn">Diễn giải</label><textarea id="fn" rows="4" placeholder="Nhập diễn giải">${esc(F.n)}</textarea></div>`;
    let body='';
    if(mode==='c'||mode==='t'){const fr=freq(mode);
      body=`<div class="fgrid2"><div class="fcol">${amt('Số tiền')}<div class="quick">${['000','+50k','+100k','+500k','+1tr'].map((q,i)=>`<button data-q="${['000','50000','100000','500000','1000000'][i]}">${q}</button>`).join('')}</div><div class="f"><label for="fw">Tài khoản *</label>${wsel('fw',F.w)}</div>${dt}<div class="f"><label for="fwho">${mode==='t'?'Thu từ ai':'Chi cho ai'}</label><input id="fwho" value="${esc(F.who)}" placeholder="Khách hàng / nhà cung cấp / người vay"></div><div class="f"><label for="fev">Chuyến đi, sự kiện / dự án</label><input id="fev" value="${esc(F.ev)}"></div><label class="chk"><input type="checkbox" id="fnr" ${F.nr?'checked':''}> Không tính vào báo cáo <small>Ghi chép vẫn tính vào số dư tài khoản nhưng không vào báo cáo thu chi.</small></label></div>
      <div class="fcol"><div class="f"><label>Hạng mục *</label><button class="pickf" id="fpick">${F.c?ico(F.c,F.s):''}<span>${F.c?esc(F.s?F.c+' › '+F.s:F.c):'<i>Chọn hạng mục</i>'}</span><b>▾</b></button>
      <div class="qcats">${fr.map(([c,s])=>`<button class="${F.c===c&&(F.s||'')===s?'on':''}" data-qc="${esc(c)}" data-qs="${esc(s)}">${ico(c,s)}${esc(s||c)}</button>`).join('')}</div></div>${note}
      <div class="f"><label>${mode==='t'?'Ảnh chứng từ':'Ảnh hàng hoá / hoá đơn'}${F.ph.length?` · ${F.ph.length} ảnh`:''}</label><div class="phbox" id="phbox">${F.ph.map((p,i)=>`<div class="ph${p._up?' up':''}"><img src="${esc(p.u)}" alt="Ảnh ${i+1}" data-phv="${i}">${p._up?'':`<button class="rm" data-phrm="${i}" aria-label="Bỏ ảnh">✕</button>`}</div>`).join('')}<label class="phadd" for="phfile"><span><b>＋</b>Thêm ảnh</span></label><input type="file" id="phfile" accept="image/*" multiple hidden></div><div class="phhint">Chụp / chọn ảnh, kéo thả hoặc dán (Ctrl+V) ảnh vào đây.</div></div></div></div>`}
    else if(mode==='x'){body=`<div class="fgrid2"><div class="fcol">${amt('Số tiền')}<div class="f"><label for="fw">Từ tài khoản *</label>${wsel('fw',F.w)}</div><div class="f"><label for="fw2">Đến tài khoản *</label>${wsel('fw2',F.w2)}</div></div><div class="fcol">${dt}${note}</div></div><p class="note">Chuyển khoản giữa hai tài khoản: số dư thay đổi nhưng không tính vào thu chi.</p>`}
    else{const bal=(balances(['skylap']).find(x=>x.name===F.w)||{}).bal||0;const act=F._act??'';const diff=act===''?0:(+act-bal);
      body=`<div class="fgrid2"><div class="fcol"><div class="f"><label for="fw">Tài khoản *</label>${wsel('fw',F.w)}</div><div class="f"><label for="fact">Số dư thực tế *</label><div class="amtbox"><input class="amtin num" id="fact" inputmode="numeric" value="${act===''?'':fmt(act)}" placeholder="0"><span>₫</span></div></div>
      <div class="kv num"><div><span>Số dư trên sổ</span><b>${fmt(bal)} đ</b></div><div class="tot"><span>Chênh lệch</span><b class="${diff>=0?'g':'r'}">${diff>0?'+':''}${fmt(diff)} đ</b></div></div></div><div class="fcol">${dt}${note}</div></div><p class="note">App ghi một khoản điều chỉnh bằng phần chênh lệch để số dư khớp thực tế. Khoản này không tính vào báo cáo thu chi.</p>`}

    ${!old&&S.sample&&(mode==='c'||mode==='t')?`<div class="aibar"><input id="aitxt" value="${esc(F._aitxt||'')}" placeholder="✨ Ghi nhanh bằng AI: “cafe tiếp khách 25k”, “thu tiền thuê cty ABC 12tr”, hoặc chụp hoá đơn 📷" aria-label="Ghi nhanh bằng câu"><label class="aiimg" for="aiimg" title="Chụp hoặc chọn ảnh hoá đơn">📷</label><input type="file" id="aiimg" accept="image/*" hidden><button class="btn pri" id="aigo">Điền</button></div><p class="note" id="aimsg" style="margin:-6px 0 0">${esc(F._aimsg||(F._img?'Đã chọn ảnh: '+F._img.name+' · bấm Điền':''))}</p>`:''}
    <div class="ftabs">${[['c','Chi tiền'],['t','Thu tiền'],['x','Chuyển khoản'],['adj','Điều chỉnh số dư']].map(([k,l])=>`<button data-fm="${k}" class="${mode===k?'on':''}" ${old&&k!==mode?'disabled':''}>${l}</button>`).join('')}</div>
    ${F.ct?`<div class="banner">Thu tiền thuê kỳ T${perVN(F.per)} · lưu xong sẽ đánh dấu đã thu cho hợp đồng.</div>`:''}${F.rc?`<div class="banner">Khoản định kỳ kỳ T${perVN(F.per)}.</div>`:''}
    ${body}

    <div class="factions">${old?'<button class="btn dan" id="fdel">Xoá</button>':''}<span class="sp"></span><button class="btn" id="fcancel2">Huỷ</button>${old?'':'<button class="btn out" id="fsave2">Lưu và thêm</button>'}<button class="btn pri" id="fsave">Lưu</button></div>`,'form');
    const sync=()=>{if($('#aitxt'))F._aitxt=$('#aitxt').value;if($('#fa'))F.a=parseInt($('#fa').value.replace(/\D/g,''))||0;if($('#fdt')&&$('#fdt').value){const [d,t]=$('#fdt').value.split('T');F.d=d;F.t=(t||'').slice(0,5)}if($('#fw'))F.w=$('#fw').value;if($('#fw2'))F.w2=$('#fw2').value;if($('#fn'))F.n=$('#fn').value;if($('#fwho'))F.who=$('#fwho').value;if($('#fev'))F.ev=$('#fev').value;if($('#fnr'))F.nr=$('#fnr').checked;if($('#fact')){const r=$('#fact').value.trim();F._act=r===''?'':(parseInt(r.replace(/\D/g,''))||0)*(r.startsWith('-')?-1:1)}};
    ['fa','fact'].forEach(id=>{const el=$('#'+id);if(el)el.addEventListener('input',e=>{const r=e.target.value.trim();const neg=id==='fact'&&r.startsWith('-');const v=parseInt(r.replace(/\D/g,''))||0;e.target.value=v?(neg?'-':'')+fmt(v):(neg?'-':'');if(id==='fact'){sync();const pos=e.target.value.length;draw();const n=$('#fact');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}})});
    if($('#fw')&&mode==='adj')$('#fw').onchange=()=>{sync();draw()};
    const ai=$('#aiimg');if(ai)ai.onchange=()=>{F._img=ai.files[0]||null;F._aimsg='';$('#aimsg').textContent=F._img?'Đã chọn ảnh: '+F._img.name+' · bấm Điền':''};
    const at=$('#aitxt');if(at)at.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#aigo').click()}};
    if(!old&&!F._done){F._done=1;setTimeout(()=>{const el=(F._focusAI&&$('#aitxt'))||$('#fa')||$('#fact');el&&el.focus()},50)}
    const addFiles=async files=>{files=[...files].filter(f=>/^image\//.test(f.type));if(!files.length)return;sync();

    const pf=$('#phfile');if(pf)pf.onchange=e=>{addFiles(e.target.files);e.target.value=''};

function parseDate(v){if(v instanceof Date)return isoOf(v);if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d.y+'-'+pad(d.m)+'-'+pad(d.d)}
  const m=String(v||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);const m2=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:null}
function parseTime(v){if(typeof v==='number'){const s=Math.round((v%1)*86400);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))}const m=String(v||'').match(/(\d{1,2}):(\d{2})/);return m?pad(m[1])+':'+m[2]:''}

async function importFile(file){
  const out=$('#impres');out.innerHTML='<p class="note">Đang đọc file…</p>';
  try{await needXLSX()}catch(e){}if(typeof XLSX==='undefined'){out.innerHTML='<div class="banner err">Không tải được bộ đọc Excel. Tải lại trang rồi thử lại.</div>';return}
  try{const wb=XLSX.read(await file.arrayBuffer(),{cellDates:false});
    let skipped=0;const rows=[];const existing=new Set();for(const b of booksVisible())for(const it of allItems([b]))existing.add(b+'#'+keyOf(it));
    for(const sn of wb.SheetNames){const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
      const hi=aoa.findIndex(r=>r.some(c=>String(c).trim()==='Ngày')&&r.some(c=>/tiền chi|tiền thu/i.test(String(c))));if(hi<0)continue;
      const H=aoa[hi].map(c=>String(c).trim().toLowerCase());const col=n=>H.findIndex(h=>h===n);const colRx=rx=>H.findIndex(h=>rx.test(h));
      const C={d:col('ngày'),t:col('giờ'),thu:colRx(/tiền thu/),chi:colRx(/tiền chi/),c:col('hạng mục cha'),s:col('hạng mục con'),who:colRx(/cho ai|từ ai/),ev:colRx(/sự kiện/),n:col('diễn giải'),w:col('ví'),b:col('sổ')};if(C.c<0)C.c=col('hạng mục');
      for(const r of aoa.slice(hi+1)){const d=parseDate(r[C.d]);if(!d)continue;const thu=num(r[C.thu]),chi=num(r[C.chi]);if(!thu&&!chi)continue;
        const it={d,t:parseTime(C.t>=0?r[C.t]:''),k:thu>0?'t':'c',a:Math.round(thu>0?thu:chi),c:String(r[C.c]||'Khác').trim()||'Khác',s:C.s>=0?String(r[C.s]||'').trim():'',who:C.who>=0?String(r[C.who]||'').trim():'',ev:C.ev>=0?String(r[C.ev]||'').trim():'',n:C.n>=0?String(r[C.n]||'').trim():'',w:C.w>=0&&r[C.w]?String(r[C.w]).trim():(sn==='ví'?'Ví MISA':sn),src:'misa'};
        const bc=C.b>=0?String(r[C.b]).trim():'';const b=bc==='Cá nhân'?'canhan':bc==='SKYLAP'?'skylap':bookFor(it.c);
        if(b!=='skylap'){skipped++;continue}rows.push({b,it,dup:existing.has(b+'#'+keyOf(it))})}}
    if(!rows.length&&skipped){out.innerHTML='<div class="banner">File chỉ có '+skipped+' dòng chi tiêu cá nhân, không có khoản nào của công ty để nhập.</div>';return}
    if(!rows.length){out.innerHTML='<div class="banner err">Không tìm thấy bảng thu chi trong file. Cần có dòng tiêu đề gồm “Ngày”, “Số tiền thu”, “Số tiền chi”, “Hạng mục cha”.</div>';return}
    const fresh=rows.filter(r=>!r.dup);const by=b=>fresh.filter(r=>r.b===b).length;
    out.innerHTML=`<div class="banner" style="margin-top:12px"><b>${esc(file.name)}</b>: ${rows.length} dòng · <b>${fresh.length} mới</b> · ${rows.length-fresh.length} đã có (bỏ qua)${skipped?` · ${skipped} dòng chi tiêu cá nhân (không nhập)`:''}.</div>${fresh.length?'<div class="actions" style="justify-content:flex-start;margin-top:8px"><button class="btn pri" id="impgo">Nhập '+fresh.length+' giao dịch mới</button></div>':''}`;
    const go=$('#impgo');if(go)go.onclick=async()=>{go.disabled=true;go.textContent='Đang nhập…';
      try{const groups={};fresh.forEach((r,i)=>{r.it.id='i'+Date.now().toString(36)+i.toString(36);r.it.by=S.uid||'';r.it.ts=Date.now();const k=r.b+'|'+ymOf(r.it.d);(groups[k]=groups[k]||[]).push(r.it)});
        const newCats={};for(const r of fresh){const ty=r.it.k==='t'?'thu':'chi';const p=meta(r.b).cats[ty].find(c=>c.p===r.it.c);if(!p||(r.it.s&&!p.ch.includes(r.it.s)))(newCats[r.b]=newCats[r.b]||[]).push([ty,r.it.c,r.it.s])}
        for(const b in newCats)await mutateMeta(b,m=>{for(const [ty,p,s] of newCats[b]){let c=m.cats[ty].find(x=>x.p===p);if(!c){c={p,ch:[]};m.cats[ty].push(c)}if(s&&!c.ch.includes(s))c.ch.push(s)}return m});
        let n=0;const keys=Object.keys(groups);

        for(const b of new Set(fresh.map(r=>r.b)))await mutateMeta(b,m=>{m.lastSync=Date.now();return m});
        out.innerHTML='<div class="banner" style="margin-top:12px">Đã nhập '+fresh.length+' giao dịch mới.</div>';toast('Nhập Excel xong')}catch(err){out.innerHTML='<div class="banner err">'+esc(wrapErr(err))+'</div>'}};
  }catch(err){out.innerHTML='<div class="banner err">Không đọc được file: '+esc(err.message||err)+'</div>'}

function shrinkImg(file,size){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=()=>no(new Error("Không đọc được ảnh"));fr.onload=()=>{const im=new Image();im.onerror=()=>no(new Error("File không phải ảnh"));im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(im.width,im.height);c.width=c.height=size;c.getContext("2d").drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,size,size);ok(c.toDataURL("image/jpeg",.82))};im.src=fr.result};fr.readAsDataURL(file)})}

    else if(!gvDelivered(j)&&j.ngayGiao){const d=dDiff(j.ngayGiao);const l=d<0?"over":d===0?"today":d===1?"soon":null;if(l)out.push({key:"g:"+j.id+":"+l,lv:l,d,kind:"Giao máy",cls:"k-g",title:j.congTy||"(chưa có tên)",sub:(d<0?"Trễ giao · hẹn ":"Giao ")+vnDate(j.ngayGiao)+(j.gioGiao?" "+j.gioGiao:"")+(j.nguoi?" · "+j.nguoi:" · chưa phân công"),go:()=>gvGo(j.id)})}});

function machineMap(){const sm=stockMap(),m=new Map(),act=new Map(),hold=new Map(),lo=new Map();
  S.jobs.forEach(j=>jobItems(j).forEach(i=>{
    if(gvDelivered(j)&&!GV_DONE.includes(j.trangThai)&&gvReturns(j)&&!gvPickupOnly(j))act.set(i.pid,{k:"rent",j});
    else if(gvDelivered(j)&&/ban/.test(norm(j.mucDich))){if(!act.has(i.pid))act.set(i.pid,{k:"sold",j})}
    else if(!gvDelivered(j)&&!gvPickupOnly(j))hold.set(i.pid,j)}));
  [...S.txns].sort((a,b)=>a.date===b.date?(a.ts||0)-(b.ts||0):a.date<b.date?-1:1).forEach(t=>(t.lines||[]).forEach(l=>{if(lineQty(t,l)<0)lo.set(l.pid,t)}));
  S.products.forEach(p=>{const q=sm.get(p.id)||0,a=act.get(p.id);let r;
    if(a&&a.k==="rent")r={k:"rent",jobId:a.j.id,label:"Đang cho thuê",detail:a.j.congTy+(a.j.ngayThuHoi?" · thu hồi "+vnDate(a.j.ngayThuHoi):"")+(q>0?" · kho chưa xuất":""),late:gvLate(a.j)};
    else if(q>0&&resvOfPid(p.id)){const rv=resvOfPid(p.id);r={k:"resv",label:"Đã đặt trước",detail:rv.customer+(rv.to?" · giữ đến "+vnDate(rv.to):"")}}
    else if(q>0){const h=hold.get(p.id);r={k:"in",label:"Trong kho",detail:h?"Giữ cho "+h.congTy+(h.ngayGiao?" · giao "+vnDate(h.ngayGiao):""):""}}
    else if(a&&a.k==="sold")r={k:"sold",jobId:a.j.id,label:"Đã bán",detail:a.j.congTy+(a.j.ngayGiao?" · "+vnDate(a.j.ngayGiao):"")};
    else{const t=lo.get(p.id),j=t&&t.jobId?S.jobs.find(x=>x.id===t.jobId):null;
      if(t&&t.type==="sale")r={k:"sold",label:"Đã bán",detail:(t.partner||"Khách lẻ")+" · "+vnDate(t.date)};
      else if(t&&t.type==="job_out")r=j&&/ban/.test(norm(j.mucDich))?{k:"sold",label:"Đã bán",detail:t.partner+" · "+vnDate(t.date)}:{k:"rent",label:"Đang cho thuê",detail:(t.partner||"")+" · từ "+vnDate(t.date)};
      else if(t&&t.type==="ret_out")r={k:"out",label:"Đã trả NCC",detail:(t.partner||"")+" · "+vnDate(t.date)};
      else if(t)r={k:"out",label:"Đã xuất",detail:(TT[t.type]?TT[t.type].name:"")+" · "+vnDate(t.date)};
      else r={k:"none",label:"Chưa nhập kho",detail:"Lập phiếu nhập hàng để có tồn"}}
    m.set(p.id,r)});return m}
const mPill=r=>r?`<span class="pill p-${r.late?"zero":{in:"in",resv:"low",rent:"sale",sold:"ok",out:"low",none:"zero"}[r.k]}">${r.late?"Quá hạn thu hồi":r.label}</span>${r.detail?`<div class="hint">${esc(r.detail)}</div>`:""}`:"";

        ${warn.length?`<div class="err">Chưa xuất kho được:<ul style="margin:4px 0;padding-left:18px">${warn.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}

      <td class="num"><b>${m.list.length}</b></td><td class="num hl-in"><b style="color:${inStock?"var(--ok,#15803d)":"var(--bad,#b91c1c)"}">${inStock}</b></td><td class="num hl-rent"><b>${c.rent||'<span class="muted">0</span>'}</b></td>${["sold","resv"].map(k=>`<td class="num">${c[k]||'<span class="muted">–</span>'}</td>`).join("")}<td class="num">${c.other||'<span class="muted">–</span>'}</td><td class="num cc">${money(v)}</td>

function parseCsv(s){const first=s.split("\n")[0],sep=first.split(";").length>first.split(",").length?";":",",out=[];let row=[],cur="",q=false;
  for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'){if(s[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=""}else if(c==="\n"){row.push(cur.replace(/\r$/,""));out.push(row);row=[];cur=""}else cur+=c}
  if(cur||row.length){row.push(cur);out.push(row)}return out}

    rows=rows.filter(r=>/^[\x20-\x7E]+$/.test(r.sku));$("#impGo").disabled=!rows.length});
  $("#impGo").addEventListener("click",async()=>{const go=$("#impGo");go.disabled=true;let n=0;
    try{const ng=new Set(S.groups);rows.forEach(r=>r.group&&ng.add(r.group));if(ng.size!==S.groups.length)await saveGroups(Array.from(ng));
      for(const r of rows){const ex=prodList().find(p=>norm(p.sku)===norm(r.sku));const body={...r,barcode:ex&&ex.barcode&&ex.barcode!==ex.sku?ex.barcode:r.sku,updatedAt:Date.now()};
        if(ex)await S.db.doc("products/"+ex.id).update(body);else await S.db.collection("products").add({...body,createdAt:Date.now(),createdBy:S.uid||null});n++;go.textContent=`Đang nhập ${n}/${rows.length}…`}
      $("#dlg").close();toast(`Đã nhập ${n} mặt hàng`)}catch(x){$("#impErr").textContent=dbErr(x)+` (đã nhập ${n})`;$("#impErr").hidden=false;go.disabled=false}})}

function barcodeSvg(value,opts){if(!window.JsBarcode)return null;

    window.JsBarcode(svg,value,Object.assign({format:"CODE128",width:2,height:60,fontSize:14,margin:6,background:"#FFFFFF",lineColor:"#000000",font:"monospace"},opts||{}));return svg}catch(e){return null}}

  saveFile("tem-ma-vach-"+today()+".html",`<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Tem mã vạch</title><style>
@page{size:A4;margin:8mm}body{font-family:Arial,sans-serif;margin:0;color:#000}.hint{font-size:12px;color:#555;margin:0 0 6mm}@media print{.hint{display:none}}
