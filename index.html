function partnerScreen(kind){const K=PK[kind];return{title:K.name,icon:kind==="customer"?"person":"truck",
  mount(el){this.el=el;el.innerHTML=`<div class="head"><h2>Danh mục ${K.name.toLowerCase()}</h2><button class="btn pri" type="button" data-r="new">+ Thêm ${K.name.toLowerCase()}</button></div>
    <div class="row"><input data-r="q" placeholder="Tìm theo mã, tên, số điện thoại…" style="flex:1 1 240px" aria-label="Tìm"><label class="row" style="gap:6px"><input type="checkbox" data-r="debt"> <span>Chỉ hiện đang có công nợ</span></label></div>
    <div class="tbl-wrap"><table><thead><tr><th>Mã</th><th>Tên</th><th>Điện thoại</th><th>Địa chỉ</th><th>MST</th><th class="num">${kind==="customer"?"Khách đang nợ":"Mình đang nợ"}</th><th></th></tr></thead><tbody data-r="body"></tbody><tfoot data-r="foot"></tfoot></table></div>`;
    $('[data-r="new"]',el).addEventListener("click",()=>openPartner(kind));$('[data-r="q"]',el).addEventListener("input",()=>this.refresh());$('[data-r="debt"]',el).addEventListener("change",()=>this.refresh())},
  refresh(){const el=this.el,qs=norm($('[data-r="q"]',el).value),od=$('[data-r="debt"]',el).checked,bal=balances();let tot=0;
    const rows=partnerList(kind).filter(p=>(!qs||norm([p.code,p.name,p.phone,p.address].join(" ")).includes(qs))&&(!od||Math.abs(bal.get(p.id)||0)>0.5));
    $('[data-r="body"]',el).innerHTML=rows.length?rows.map(p=>{const b=bal.get(p.id)||0;tot+=b;return`<tr><td class="mono">${esc(p.code)}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.phone||"")}</td><td class="muted">${esc(p.address||"")}</td><td class="mono muted">${esc(p.taxId||"")}</td>
      <td class="num ${b>0.5?"neg":""}"><b>${money(b)}</b></td><td style="white-space:nowrap"><button class="link" type="button" data-st="${esc(p.id)}">Sổ chi tiết</button><button class="link" type="button" data-ed="${esc(p.id)}">Sửa</button></td></tr>`}).join("")
      :`<tr><td colspan="7"><div class="empty">${partnerList(kind).length?"<span>Không có kết quả.</span>":`<b>Chưa có ${K.name.toLowerCase()}</b><span>Thêm ở đây, hoặc gõ tên mới khi lập phiếu — phần mềm sẽ tự thêm vào danh mục.</span>`}</div></td></tr>`;
    $('[data-r="foot"]',el).innerHTML=rows.length?`<tr><td colspan="5">Tổng ${rows.length}</td><td class="num">${money(tot)}</td><td></td></tr>`:"";
    $$("[data-ed]",el).forEach(b=>b.addEventListener("click",()=>openPartner(kind,b.dataset.ed)));$$("[data-st]",el).forEach(b=>b.addEventListener("click",()=>openStatement(b.dataset.st)))}}}
SCR.customers=partnerScreen("customer");SCR.suppliers=partnerScreen("supplier");
function openPartner(kind,id,cb,preName){if(!guard())return;const p=id?S.partners.get(id):{name:preName||""},K=PK[kind];
  dlg(`<h2>${id?"Sửa":"Thêm"} ${K.name.toLowerCase()}</h2><div class="fgrid">
    <label class="field"><span>Mã</span><input id="ppCode" value="${esc(p.code||nextPartnerCode(kind))}"></label>
    <label class="field" style="grid-column:span 2"><span>Tên *</span><input id="ppName" value="${esc(p.name||"")}"></label>
    <label class="field"><span>Điện thoại</span><input id="ppPhone" value="${esc(p.phone||"")}"></label>
    <label class="field"><span>Mã số thuế</span><input id="ppTax" value="${esc(p.taxId||"")}"></label>
    <label class="field" style="grid-column:1/-1"><span>Địa chỉ</span><input id="ppAddr" value="${esc(p.address||"")}"></label>
    <label class="field"><span>Chiết khấu (%)</span><input id="ppDisc" type="number" min="0" max="100" step="any" value="${esc(p.discount||"")}"></label>
    <label class="field" style="grid-column:1/-1"><span>Ghi chú</span><input id="ppNote" value="${esc(p.note||"")}"></label></div>
    <span class="err" id="ppErr" hidden></span>
    <div class="actions">${id?`<button class="btn danger" type="button" id="ppDel">Xoá</button>`:""}<span class="sp"></span><button class="btn" type="button" data-close>Huỷ</button><button class="btn pri" type="button" id="ppSave">Lưu</button></div>`);
  setTimeout(()=>$("#ppName").focus(),20);const err=m=>{$("#ppErr").textContent=m;$("#ppErr").hidden=false};
  $("#ppSave").addEventListener("click",async()=>{const name=$("#ppName").value.trim(),code=$("#ppCode").value.trim();if(!name)return err("Nhập tên.");
    const dup=partnerList(kind).find(x=>x.id!==id&&norm(x.code)===norm(code));if(dup)return err(`Mã ${code} đã dùng cho ${dup.name}.`);
    const body={kind,code,name,phone:$("#ppPhone").value.trim(),taxId:$("#ppTax").value.trim(),address:$("#ppAddr").value.trim(),note:$("#ppNote").value.trim(),discount:+$("#ppDisc").value||0};
    try{let pid=id;if(id)await S.db.doc("partners/"+id).update(body);else{body.createdAt=Date.now();const r=await S.db.collection("partners").add(body);pid=r.id}
      $("#dlg").close();toast("Đã lưu "+name);if(cb)cb({id:pid,...body})}catch(x){err(dbErr(x))}});
  const del=$("#ppDel");if(del){let arm=false;del.addEventListener("click",async()=>{const used=S.txns.some(t=>t.partnerId===id)||S.cash.some(c=>c.partnerId===id);
    if(used)return err("Đối tác này đã có chứng từ, không thể xoá.");if(!arm){arm=true;del.textContent="Bấm lần nữa để xoá";return}
    try{await S.db.doc("partners/"+id).delete();$("#dlg").close();toast("Đã xoá")}catch(x){err(dbErr(x))}})}}
function partnerEvents(pid){const p=S.partners.get(pid),ev=[];
  S.txns.forEach(t=>{if(t.partnerId!==pid)return;const tot=+t.total||0,pd=paidOf(t);
    if(t.type==="sale"||t.type==="in")ev.push({date:t.date,ts:t.ts,code:t.code,type:t.type,desc:"",inc:tot,dec:pd,ref:"txn:"+t.id});
    if(t.type==="ret_in"||t.type==="ret_out")ev.push({date:t.date,ts:t.ts,code:t.code,type:t.type,desc:"",inc:pd,dec:tot,ref:"txn:"+t.id})});
  S.cash.forEach(c=>{if(c.partnerId!==pid)return;const a=+c.amount||0,plus=(p.kind==="customer")===(c.kind==="chi");ev.push({date:c.date,ts:c.ts,code:c.code,type:c.kind,desc:c.reason||"",inc:plus?a:0,dec:plus?0:a,ref:"cash:"+c.id})});
  return ev.sort((a,b)=>a.date===b.date?(a.ts||0)-(b.ts||0):a.date<b.date?-1:1)}
function openStatement(pid){const p=S.partners.get(pid);if(!p)return;let bal=0;const ev=partnerEvents(pid);
  const rows=ev.map(e=>{bal+=e.inc-e.dec;return`<tr class="click" data-doc="${e.ref}"><td>${vnDate(e.date)}</td><td class="mono">${esc(e.code)}</td><td>${typePill(e.type)} <span class="muted">${esc(e.desc)}</span></td><td class="num">${e.inc?fmt(e.inc):""}</td><td class="num">${e.dec?fmt(e.dec):""}</td><td class="num"><b>${fmt(bal)}</b></td></tr>`});
  const b=dlg(`<h2>Sổ chi tiết công nợ: ${esc(p.name)}</h2><p class="muted">${esc(p.code)}${p.phone?" · "+esc(p.phone):""} · ${p.kind==="customer"?"Khách đang nợ":"Mình đang nợ NCC"}: <b>${money(bal)}</b></p>
   <div class="tbl-wrap"><table><thead><tr><th>Ngày</th><th>Số CT</th><th>Diễn giải</th><th class="num">Phát sinh nợ</th><th class="num">Đã trả / giảm</th><th class="num">Còn nợ</th></tr></thead><tbody>${rows.reverse().join("")||`<tr><td colspan="6"><div class="empty"><span>Chưa có giao dịch.</span></div></td></tr>`}</tbody></table></div>
   <div class="actions"><button class="btn" type="button" id="stCsv">Tải sổ (Excel)</button><span class="sp"></span><button class="btn" type="button" data-close>Đóng</button>${bal>0.5?`<button class="btn pri" type="button" id="stPay">${p.kind==="customer"?"Lập phiếu thu":"Lập phiếu chi"}</button>`:""}</div>`);
  $$("[data-doc]",b).forEach(x=>x.addEventListener("click",()=>openDoc(x.dataset.doc)));
  $("#stCsv").addEventListener("click",()=>{let r=0;saveFile(`cong-no-${p.code}.csv`,csv([["Ngày","Số CT","Loại","Diễn giải","Phát sinh nợ","Đã trả / giảm","Còn nợ"],...ev.map(e=>{r+=e.inc-e.dec;return[vnDate(e.date),e.code,TT[e.type]?TT[e.type].name:e.type==="thu"?"Phiếu thu":"Phiếu chi",e.desc,e.inc,e.dec,r]})]))});
  const pay=$("#stPay");if(pay)pay.addEventListener("click",()=>{$("#dlg").close();const k=p.kind==="customer"?"thu":"chi";openScreen(k);const s=SCR[k];s.f("pk").value=p.kind;s.pkUpd();s.f("partner").value=p.name;s.f("amount").value=bal;s.f("amount").dispatchEvent(new Event("input"));s.phint()})}

SCR.r_nxt={title:"Nhập xuất tồn",icon:"bars",
  mount(el){this.el=el;el.innerHTML=`<div class="head"><h2>Báo cáo nhập – xuất – tồn</h2><button class="btn" type="button" data-r="csv">Tải báo cáo (Excel)</button></div>
    <div class="row">${rangeBar("nxt")}<select data-r="g" style="flex:0 1 170px" aria-label="Nhóm hàng"></select></div>
    <div class="tbl-wrap"><table><thead><tr><th>Mã</th><th>Tên hàng</th><th>Nhóm</th><th>ĐVT</th><th class="num">Tồn đầu</th><th class="num">Nhập</th><th class="num">Xuất</th><th class="num">Kiểm kê ±</th><th class="num">Tồn cuối</th><th class="num">Giá trị tồn cuối</th></tr></thead><tbody data-r="body"></tbody><tfoot data-r="foot"></tfoot></table></div>
    <p class="hint">Nhập = nhập hàng + khách trả. Xuất = bán hàng + trả NCC + xuất khác. Bấm một dòng để xem thẻ kho.</p>`;
    this.rg=bindRange(el,"nxt",()=>this.refresh());$('[data-r="g"]',el).addEventListener("input",()=>this.refresh());
    $('[data-r="csv"]',el).addEventListener("click",()=>{const[f,t]=this.rg();saveFile(`nhap-xuat-ton_${f}_${t}.csv`,csv([["Mã","Tên hàng","Nhóm","ĐVT","Tồn đầu","Nhập","Xuất","Kiểm kê","Tồn cuối","Giá trị tồn cuối"],...this.rows().map(r=>[r.p.sku,r.p.name,r.p.group||"",r.p.unit,r.open,r.inQ,r.outQ,r.adj,r.close,r.close*(+r.p.cost||0)])]))})},
  rows(){const[f,t]=this.rg(),gf=$('[data-r="g"]',this.el).value,m=new Map();
    const get=(pid,l)=>{if(!m.has(pid)){const p=S.products.get(pid)||{sku:l&&l.sku,name:((l&&l.name)||"")+" (đã xoá)",unit:l&&l.unit};m.set(pid,{pid,p,open:0,inQ:0,outQ:0,adj:0})}return m.get(pid)};
    S.products.forEach(p=>get(p.id));
    S.txns.forEach(x=>(x.lines||[]).forEach(l=>{const r=get(l.pid,l),q=lineQty(x,l);if(x.date<f)r.open+=q;else if(x.date<=t){if(x.type==="adj")r.adj+=q;else if(q>0)r.inQ+=q;else r.outQ-=q}}));
    return Array.from(m.values()).map(r=>({...r,close:r.open+r.inQ-r.outQ+r.adj})).filter(r=>inGroup(r.p,gf)).sort((a,b)=>String(a.p.sku).localeCompare(String(b.p.sku)))},
  refresh(){const el=this.el,sel=$('[data-r="g"]',el),cur=sel.value;sel.innerHTML=`<option value="">Tất cả nhóm</option>`+allGroups().map(g=>`<option value="${esc(g)}"${g===cur?" selected":""}>${esc(g)}</option>`).join("")+`<option value="__none"${cur==="__none"?" selected":""}>Chưa phân nhóm</option>`;
    const rows=this.rows(),s=k=>rows.reduce((a,r)=>a+r[k],0),tv=rows.reduce((a,r)=>a+r.close*(+r.p.cost||0),0);
    $('[data-r="body"]',el).innerHTML=rows.length?rows.map(r=>`<tr class="click" data-card="${esc(r.pid)}"><td class="mono">${esc(r.p.sku)}</td><td>${esc(r.p.name)}</td><td class="muted">${esc(r.p.group||"")}</td><td>${esc(r.p.unit)}</td>
      <td class="num">${fmt(r.open)}</td><td class="num pos">${r.inQ?fmt(r.inQ):"–"}</td><td class="num" style="color:var(--out)">${r.outQ?fmt(r.outQ):"–"}</td><td class="num">${r.adj?(r.adj>0?"+":"")+fmt(r.adj):"–"}</td><td class="num"><b>${fmt(r.close)}</b></td><td class="num">${money(r.close*(+r.p.cost||0))}</td></tr>`).join("")
      :`<tr><td colspan="10"><div class="empty"><span>Chưa có dữ liệu.</span></div></td></tr>`;
    $('[data-r="foot"]',el).innerHTML=rows.length?`<tr><td colspan="4">Tổng</td><td class="num">${fmt(s("open"))}</td><td class="num">${fmt(s("inQ"))}</td><td class="num">${fmt(s("outQ"))}</td><td class="num">${fmt(s("adj"))}</td><td class="num">${fmt(s("close"))}</td><td class="num">${money(tv)}</td></tr>`:"";
    $$("[data-card]",el).forEach(r=>r.addEventListener("click",()=>openCard(r.dataset.card)))}};

SCR.r_sales={title:"Doanh thu, lợi nhuận",icon:"money",
  mount(el){this.el=el;el.innerHTML=`<div class="head"><h2>Doanh thu và lợi nhuận</h2><button class="btn" type="button" data-r="csv">Tải báo cáo (Excel)</button></div>
    <div class="row">${rangeBar("rs")}</div><div data-r="kpi"></div>
    <div class="grid2"><div class="panel"><h3 style="margin-bottom:8px">Theo ngày</h3><div class="tbl-wrap"><table><thead><tr><th>Ngày</th><th class="num">Số HĐ</th><th class="num">Doanh thu</th><th class="num">Khách trả</th><th class="num">Giá vốn</th><th class="num">Lãi gộp</th></tr></thead><tbody data-r="days"></tbody></table></div></div>
    <div class="panel"><h3 style="margin-bottom:8px">Mặt hàng bán chạy</h3><div class="tbl-wrap"><table><thead><tr><th>Hàng</th><th class="num">SL</th><th class="num">Doanh số</th><th class="num">Lãi</th></tr></thead><tbody data-r="top"></tbody></table></div></div></div>
    <p class="hint">Doanh thu đã trừ giảm giá trên hoá đơn. Giá vốn tính theo giá nhập của mặt hàng tại thời điểm bán. Doanh số theo mặt hàng tính trước giảm giá hoá đơn.</p>`;
    this.rg=bindRange(el,"rs",()=>this.refresh());
    $('[data-r="csv"]',el).addEventListener("click",()=>{const d=this.data();saveFile(`doanh-thu_${d.f}_${d.t}.csv`,csv([["Ngày","Số HĐ","Doanh thu","Khách trả hàng","Doanh thu thuần","Giá vốn","Lãi gộp"],...d.days.map(r=>[vnDate(r.d),r.n,r.rev,r.ret,r.rev-r.ret,r.cogs,r.rev-r.ret-r.cogs])]))})},
  data(){const[f,t]=this.rg(),days=new Map(),prods=new Map();
    S.txns.forEach(x=>{if(x.date<f||x.date>t)return;if(x.type!=="sale"&&x.type!=="ret_in")return;const sg=x.type==="sale"?1:-1;
      if(!days.has(x.date))days.set(x.date,{d:x.date,n:0,rev:0,ret:0,cogs:0});const r=days.get(x.date);
      if(sg>0){r.n++;r.rev+=+x.total||0}else r.ret+=+x.total||0;
      (x.lines||[]).forEach(l=>{const c=(l.cost!=null?+l.cost:+((S.products.get(l.pid)||{}).cost||0))*(+l.qty||0);r.cogs+=sg*c;
        if(!prods.has(l.pid))prods.set(l.pid,{name:l.name,sku:l.sku,q:0,v:0,pr:0});const pp=prods.get(l.pid);pp.q+=sg*l.qty;pp.v+=sg*l.qty*l.price;pp.pr+=sg*(l.qty*l.price-c)})});
    return{f,t,days:Array.from(days.values()).sort((a,b)=>a.d<b.d?1:-1),prods:Array.from(prods.values()).sort((a,b)=>b.v-a.v)}},
  refresh(){const el=this.el,d=this.data(),s=k=>d.days.reduce((a,r)=>a+r[k],0),net=s("rev")-s("ret"),gp=net-s("cogs");
    $('[data-r="kpi"]',el).innerHTML=`<div class="kpis k6"><div class="kpi"><span class="l">Số hoá đơn</span><span class="v">${fmt(s("n"))}</span></div><div class="kpi"><span class="l">Doanh thu bán</span><span class="v">${fmt(s("rev"))}</span></div>
      <div class="kpi"><span class="l">Khách trả hàng</span><span class="v">${fmt(s("ret"))}</span></div><div class="kpi"><span class="l">Doanh thu thuần</span><span class="v">${fmt(net)}</span></div>
      <div class="kpi"><span class="l">Giá vốn</span><span class="v">${fmt(s("cogs"))}</span></div><div class="kpi ${gp>=0?"good":"bad"}"><span class="l">Lãi gộp</span><span class="v">${fmt(gp)}</span><span class="s">${net?Math.round(gp/net*100)+"% doanh thu thuần":""}</span></div></div>`;
    $('[data-r="days"]',el).innerHTML=d.days.length?d.days.map(r=>`<tr><td>${vnDate(r.d)}</td><td class="num">${r.n}</td><td class="num">${fmt(r.rev)}</td><td class="num">${r.ret?fmt(r.ret):"–"}</td><td class="num">${fmt(r.cogs)}</td><td class="num ${r.rev-r.ret-r.cogs>=0?"pos":"neg"}"><b>${fmt(r.rev-r.ret-r.cogs)}</b></td></tr>`).join(""):`<tr><td colspan="6"><div class="empty"><span>Chưa có hoá đơn bán trong khoảng này.</span></div></td></tr>`;
    $('[data-r="top"]',el).innerHTML=d.prods.length?d.prods.slice(0,15).map(p=>`<tr><td><span class="mono muted">${esc(p.sku)}</span> ${esc(p.name)}</td><td class="num">${fmt(p.q)}</td><td class="num">${fmt(p.v)}</td><td class="num">${fmt(p.pr)}</td></tr>`).join(""):`<tr><td colspan="4"><div class="empty"><span>Chưa có dữ liệu.</span></div></td></tr>`}};

SCR.r_debt={title:"Công nợ",icon:"ledger",
  mount(el){this.el=el;el.innerHTML=`<div class="head"><h2>Tổng hợp công nợ</h2><button class="btn" type="button" data-r="csv">Tải báo cáo (Excel)</button></div><div data-r="kpi"></div>

    const[ct,ch]=mk("customer"),[st,sh]=mk("supplier");$('[data-r="c"]',el).innerHTML=ch;$('[data-r="s"]',el).innerHTML=sh;
    $('[data-r="kpi"]',el).innerHTML=`<div class="kpis k3"><div class="kpi warn"><span class="l">Phải thu khách hàng</span><span class="v">${fmt(ct)}</span><span class="s">đồng</span></div><div class="kpi bad"><span class="l">Phải trả nhà cung cấp</span><span class="v">${fmt(st)}</span><span class="s">đồng</span></div><div class="kpi"><span class="l">Chênh lệch</span><span class="v">${fmt(ct-st)}</span><span class="s">phải thu − phải trả</span></div></div>`;
    $$("[data-st]",el).forEach(r=>r.addEventListener("click",()=>openStatement(r.dataset.st)))}};

SCR.r_cash={title:"Sổ quỹ",icon:"wallet",
  mount(el){this.el=el;el.innerHTML=`<div class="head"><h2>Sổ quỹ tiền</h2><button class="btn" type="button" data-r="csv">Tải sổ quỹ (Excel)</button></div>

function vnWords(num){num=Math.round(Math.abs(+num||0));if(num===0)return"Không đồng";
  const D=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"],U=["","nghìn","triệu","tỷ","nghìn tỷ","triệu tỷ"];
  const tri=(n,full)=>{const h=Math.floor(n/100),t=Math.floor(n/10)%10,u=n%10,o=[];if(full||h)o.push(D[h]+" trăm");
    if(t>1){o.push(D[t]+" mươi");if(u===1)o.push("mốt");else if(u===5)o.push("lăm");else if(u)o.push(D[u])}
    else if(t===1){o.push("mười");if(u===5)o.push("lăm");else if(u)o.push(D[u])}else if(u){if(full||h)o.push("linh");o.push(D[u])}return o.join(" ")};
  const g=[];let n=num;while(n>0){g.push(n%1000);n=Math.floor(n/1000)}const out=[];for(let i=g.length-1;i>=0;i--){if(!g[i])continue;out.push(tri(g[i],i<g.length-1)+(U[i]?" "+U[i]:""))}
  const s=out.join(" ").replace(/\s+/g," ").trim();return s.charAt(0).toUpperCase()+s.slice(1)+" đồng"}

/* ================= GIAO VIỆC (liên kết kho) ================= */
const GV_DEF={mucDich:["Thuê Máy","Gia hạn","Thu Hồi","Đổi máy","Bán máy"],nguoi:["Nghĩa","Huy"],thoiGianThue:["Thuê 1 ngày","Thuê 2 ngày","Thuê 3 ngày","Thuê 1 tuần","Thuê 2 tuần","Thuê 1 tháng"],tienDo:["Đang chuẩn bị","Đã chuẩn bị xong"],trangThai:["Chưa giao","Đang giao","Đã giao","Hoàn tất"],giayTo:["Chưa in BBBG","Đã in","Không"],tinhTrangDon:["Đang triển khai","Đã kết thúc"]};
const GV_LBL={mucDich:"Mục đích (MĐ)",nguoi:"Người thực hiện",thoiGianThue:"Thời gian thuê",tienDo:"Tiến độ công việc",trangThai:"Trạng thái",giayTo:"Giấy tờ",tinhTrangDon:"Tình trạng đơn"};
const GV_F=["congTy","mucDich","sl","noiDung","sn","snNhan","ngayGiao","gioGiao","thoiGianThue","nhanViec","diaDiem","sdt","hanhTrinh","ngayThuHoi","gioThuHoi","nguoi","tienDo","trangThai","tinhTrangDon","giayTo","phuPhi","phuPhiND","tangCa","ghiChu","phanHoiKH","yKienKH"];
const GV_DONE=["Đã thu hồi","Hoàn tất"];
S.gv=JSON.parse(JSON.stringify(GV_DEF));
const gvPickupOnly=j=>norm(j.mucDich).startsWith("thu hoi");
const gvReturns=j=>/thue|thu hoi|doi/.test(norm(j.mucDich));
const gvIdx=s=>S.gv.trangThai.indexOf(s);
const gvDelivered=j=>GV_DONE.includes(j.trangThai)||(gvIdx("Đã giao")>=0&&gvIdx(j.trangThai)>=gvIdx("Đã giao"));
const needOut=j=>!gvPickupOnly(j)&&gvDelivered(j);
const isDoi=j=>/doi may|^doi/.test(norm(j.mucDich));
const retItems=j=>{if(!j||j.lichSu)return[];const ix=skuIndex(),out=[],seen=new Set();snLines(j.snNhan).forEach(x=>{const p=ix.get(norm(x));if(p&&!seen.has(p.id)){seen.add(p.id);out.push({pid:p.id,qty:1,sn:x})}});return out};
const needIn=j=>isDoi(j)?(gvDelivered(j)&&retItems(j).length>0):(gvReturns(j)&&GV_DONE.includes(j.trangThai));
const jobTx=(j,type)=>S.txns.filter(t=>t.jobId&&t.jobId===j.id&&t.type===type);
function skuIndex(){if(S._skuV!==S.products){S._skuV=S.products;const m=new Map();S.products.forEach(p=>{m.set(norm(p.sku),p);if(p.barcode)m.set(norm(p.barcode),p)});S._sku=m}return S._sku}
const snLines=t=>String(t||"").split(/[\n,;]+/).map(x=>x.split(/\s[–-]\s/)[0].trim()).filter(Boolean);
function jobItems(j){if(j&&j.lichSu)return[];const ix=skuIndex(),out=[],seen=new Set();
  (j.items||[]).forEach(i=>{const p=(i.pid&&S.products.get(i.pid))||ix.get(norm(i.sku));if(p&&!seen.has(p.id)&&(+i.qty||1)>0){seen.add(p.id);out.push({pid:p.id,qty:+i.qty||1,sn:i.sn||i.sku||p.sku})}});
  snLines(j.sn).forEach(x=>{const p=ix.get(norm(x));if(p&&!seen.has(p.id)){seen.add(p.id);out.push({pid:p.id,qty:1,sn:x})}});
  return out}
const gvLate=j=>!!j.ngayThuHoi&&!GV_DONE.includes(j.trangThai)&&j.ngayThuHoi<today();
const gvMd=j=>{const n=norm(j.mucDich);return n.startsWith("thu hoi")?"md-thu":n.includes("doi")?"md-doi":n.includes("ban")?"md-ban":""};
const gvMoney=v=>{const n=+String(v||"").replace(/\D/g,"");return n?n.toLocaleString("vi-VN")+"đ":""};
const sumQty=a=>a.reduce((s,t)=>s+(t.lines||[]).reduce((x,l)=>x+(+l.qty||0),0),0);
function rentalDays(label){const m=/(\d+)\s*(ngày|tuần|tháng)/i.exec(label||"");if(!m)return null;const n=+m[1],u=m[2].toLowerCase();return u==="ngày"?n:u==="tuần"?n*7:n*30}
function addDays(s,n){const[y,m,d]=s.split("-").map(Number);return ymd(new Date(y,m-1,d+n))}
function stockProblem(j){if(!needOut(j)||jobTx(j,"job_out").length)return"";const sm=stockMap(),need=new Map();
  jobItems(j).forEach(i=>need.set(i.pid,(need.get(i.pid)||0)+(+i.qty)));
  for(const[pid,q] of need){const have=sm.get(pid)||0;if(q>have){const p=S.products.get(pid);return`Kho không đủ “${p.name}”: còn ${fmt(have)} ${p.unit}, đơn cần ${fmt(q)}. Kiểm tra lại trước khi chuyển sang đã giao.`}}return""}
async function syncJob(j){if(!j.id||S.syncing.has(j.id))return"";const items=jobItems(j),rits=isDoi(j)?retItems(j):items;if(!items.length&&!rits.length)return"";S.syncing.add(j.id);const done=[];
  try{const date=today();
    const mk=async(type,its)=>{its=its||items;const T=TT[type],lines=its.map(i=>{const p=S.products.get(i.pid);return{pid:p.id,sku:p.sku,name:p.name,unit:p.unit,qty:+i.qty,price:+p.cost||0,cost:+p.cost||0,sn:i.sn||""}});
      const total=lines.reduce((s,l)=>s+l.qty*l.price,0),code=nextCode(T.pre,date);
      await S.db.collection("txns").add({code,type,date,jobId:j.id,partnerId:null,partner:j.congTy||"",ref:"Đơn giao việc",note:[j.mucDich,j.nguoi].filter(Boolean).join(" · "),lines,subtotal:total,discount:0,total,paid:0,method:null,createdBy:S.uid||null,ts:Date.now()});
      S.txns.unshift({id:"tmp-"+code,code,type,date,jobId:j.id,lines,total});return code};
    if(needOut(j)&&items.length&&!jobTx(j,"job_out").length)done.push("kho đã xuất "+await mk("job_out"));
    if(needIn(j)&&rits.length&&!jobTx(j,"job_in").length&&(gvPickupOnly(j)||isDoi(j)||jobTx(j,"job_out").length))done.push("kho đã nhập lại "+await mk("job_in",rits));
  }finally{S.syncing.delete(j.id)}return done.join(", ")}
function recon(j){if(j.lichSu)return["ok","Đơn cũ (Excel) – không đối soát"];const items=jobItems(j),o=jobTx(j,"job_out"),i=jobTx(j,"job_in"),iq=items.reduce((s,x)=>s+(+x.qty||0),0);
  if((needOut(j)||needIn(j))&&!items.length&&!(isDoi(j)&&retItems(j).length))return["low","Chưa chọn máy từ kho"];
  if(needOut(j)&&!o.length)return["zero","Đã giao, kho chưa xuất"];
  if(needIn(j)&&!i.length)return["zero","Đã thu hồi, kho chưa nhập"];
  if(!needOut(j)&&!gvPickupOnly(j)&&o.length)return["zero","Đơn chưa giao nhưng kho đã xuất"];
  if(o.length&&sumQty(o)!==iq)return["low","Số máy trên đơn khác phiếu xuất"];
  if(isDoi(j)){if(i.length&&sumQty(i)!==retItems(j).length)return["low","Số máy nhận lại khác phiếu nhập"];return o.length||i.length?["in","Đổi máy · khớp kho"]:["ok","Chưa phát sinh kho"]}
  if(o.length&&i.length&&sumQty(i)!==sumQty(o))return["low","Thu hồi chưa đủ số máy đã giao"];
  if(o.length&&!i.length&&gvReturns(j))return["sale","Máy đang ở khách"];
  if(!needOut(j)&&!needIn(j))return["ok","Chưa phát sinh kho"];
  return["in","Khớp kho"]}
const reconPill=j=>{const[c,l]=recon(j);return`<span class="pill p-${c}">${l}</span>`};
const canFix=j=>{const[c]=recon(j);return c==="zero"&&jobItems(j).length&&!(!needOut(j)&&jobTx(j,"job_out").length)};

async function moveJob(id,st){if(!guard())return;const j=S.jobs.find(x=>x.id===id);if(!j)return;
  const patch={trangThai:st,updatedAt:new Date().toISOString()};
  if(st==="Hoàn tất"&&S.gv.tinhTrangDon.includes("Đã kết thúc"))patch.tinhTrangDon="Đã kết thúc";
  if(GV_DONE.includes(st)&&!j.doneAt)patch.doneAt=today();
  const next={...j,...patch},sp=stockProblem(next);if(sp){toast(sp);return}
  try{await S.db.doc("jobs/"+id).update(patch);const m=await syncJob(next);
    toast(`Chuyển sang “${st}”`+(m?" · "+m:(needOut(next)&&!jobItems(next).length?" · đơn chưa chọn máy từ kho, mở đơn để chọn":"")))}catch(x){toast(dbErr(x))}}

const TT_THUE=["Đang thuê","Gia hạn","Chưa giao","Đã hoàn thành"],TT_THU=["Đã thu","Chưa thu"],GIAYTO_R=["HĐ","BBBG","HĐ + BBBG","PLHĐ","CCCD","Không"];

const rnum=v=>{if(typeof v==="number")return v;const n=+String(v??"").replace(/[^\d-]/g,"");return isFinite(n)?n:0};
const nTT=s=>{const n=norm(s);if(!n)return"";if(n.includes("hoan"))return"Đã hoàn thành";if(n.includes("gia han"))return"Gia hạn";if(n.includes("chua giao"))return"Chưa giao";if(n.includes("thue"))return"Đang thuê";return s};
const kkey=s=>norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,90)||"khach";

function rcalc(r){const tien=rnum(r.tien),ict=rnum(r.ict),hh=rnum(r.hh),vc=rnum(r.vanChuyen),ln=tien-ict-hh,P=rPay(r);
  if(P.has)return{tien,ict,hh,vc,ln,coc:P.coc-P.hoan||rnum(r.coc),chua:Math.max(0,tien-P.thu),da:P.thu,paid:P.thu};
  return{tien,ict,hh,vc,coc:rnum(r.coc),ln,chua:r.ttThu==="Chưa thu"?ln:0,da:r.ttThu==="Đã thu"?ln-vc:0,paid:r.ttThu==="Đã thu"?tien:0}}
function rThu(r){const P=rPay(r);if(!P.has)return r.ttThu||"";const t=rnum(r.tien);return t>0&&P.thu>=t?"Đã thu":P.thu>0?"Thu một phần":"Chưa thu"}
const rMonth=r=>r.thang||(r.ngayThue||"").slice(0,7)||today().slice(0,7);
const rActive=r=>{const t=nTT(r.ttThue);return t==="Đang thuê"||t==="Gia hạn"};

function rAddTime(start,tg){if(!start||!tg)return"";const m=norm(tg).match(/(\d+)\s*(ngay|tuan|thang|nam)/);if(!m)return"";const d=new Date(start+"T00:00:00"),n=+m[1];
  if(m[2]==="ngay")d.setDate(d.getDate()+n);else if(m[2]==="tuan")d.setDate(d.getDate()+7*n);else if(m[2]==="thang")d.setMonth(d.getMonth()+n);else d.setFullYear(d.getFullYear()+n);

function rTable(rows,opts){opts=opts||{};const T={tien:0,ict:0,ln:0,coc:0,chua:0,vc:0,hh:0,da:0,sl:0};rows.forEach(r=>{const c=rcalc(r);for(const k in T)T[k]+=k==="sl"?rnum(r.sl):c[k]});

function custList(){const M=new Map();(S.rentals||[]).forEach(r=>{const k=kkey(r.kh);if(!M.has(k))M.set(k,{key:k,name:r.kh,rentals:[],quotes:[]});const c=M.get(k);c.rentals.push(r);if((r.ngayThue||"")>=(c.lastD||""))c.lastD=r.ngayThue||c.lastD,c.name=r.kh});

  (S.rkh||new Map()).forEach((d,k)=>{if(!M.has(k)&&(d.src!=="cty"||d.tagThue===true))M.set(k,{key:k,name:d.name||k,rentals:[],quotes:[]})});
  return[...M.values()].map(c=>{const info=(S.rkh&&S.rkh.get(c.key))||{};let tien=0,ln=0,no=0,act=0;const last=[...c.rentals].sort((a,b)=>(b.ngayThue||"").localeCompare(a.ngayThue||""));

const CTY_SKIP=new Set(["khach","khach-le","khach-vang-lai",""]);
function ctyList(){const M=new Map();const get=(name)=>{name=String(name||"").trim();const k=kkey(name);if(!name||CTY_SKIP.has(k))return null;if(!M.has(k))M.set(k,{key:k,name,names:new Map(),thue:[],mua:[],jobs:[],sdt:"",diaChi:"",last:"",tienThue:0,tienMua:0,act:0});const c=M.get(k);c.names.set(name,(c.names.get(name)||0)+1);return c};
  const T0=today(),seen=(c,d)=>{if(!d)return;if(d<=T0){if(!c.last||c.last>T0||d>c.last)c.last=d}else if(!c.last)c.last=d};
  (S.rentals||[]).forEach(r=>{const c=get(r.kh);if(!c)return;c.thue.push({src:"Đơn thuê",code:r.code||"",date:r.ngayThue||"",desc:r.may||"",sl:r.sl,ref:r});c.tienThue+=rcalc(r).tien;if(rActive(r))c.act+=rnum(r.sl)||1;if(!c.sdt&&r.sdt)c.sdt=r.sdt;if(!c.diaChi&&r.diaChi)c.diaChi=r.diaChi;seen(c,r.ngayThue)});
  (S.dban||[]).forEach(d=>{const c=get(d.kh);if(!c)return;c.mua.push({src:"Đơn bán",code:d.code||"",date:d.ngay||"",desc:d.sp||"",sl:d.sl});c.tienMua+=bcalc(d).gb;if(!c.sdt&&d.sdt)c.sdt=d.sdt;if(!c.diaChi&&d.diaChi)c.diaChi=d.diaChi;seen(c,d.ngay)});
  (S.txns||[]).forEach(t=>{if(t.type!=="sale"||t.jobId)return;const p=t.partnerId&&S.partners.get(t.partnerId),c=get(t.partner||(p&&p.name));if(!c)return;c.mua.push({src:"Hoá đơn kho",code:t.code||"",date:t.date||"",desc:(t.lines||[]).map(l=>l.name).filter(Boolean).slice(0,3).join(", "),sl:(t.lines||[]).reduce((s,l)=>s+(+l.qty||0),0)});c.tienMua+=+t.total||0;seen(c,t.date)});
  (S.jobs||[]).forEach(j=>{if(j.lichSu)return;const c=get(j.congTy);if(!c)return;const md=norm(j.mucDich);const it={src:"Giao việc",code:j.mucDich||"",date:j.ngayGiao||String(j.createdAt||"").slice(0,10),desc:String(j.noiDung||"").split("\n")[0].slice(0,80),sl:j.sl,job:j};c.jobs.push(it);
    if(/thue/.test(md))c.jobThue=(c.jobThue||0)+1;else if(/ban|mua/.test(md))c.jobMua=(c.jobMua||0)+1;if(!c.sdt&&j.sdt)c.sdt=j.sdt;if(!c.diaChi&&j.diaChi)c.diaChi=j.diaChi;seen(c,it.date)});
  (S.quotes||[]).forEach(q=>{const c=get(q.kh);if(c){c.bg=(c.bg||0)+1;if(!c.sdt&&q.sdt)c.sdt=q.sdt}});
  S.partners.forEach(p=>{if(p.kind!=="customer")return;const c=get(p.name);if(!c)return;if(!c.sdt&&p.phone)c.sdt=p.phone;if(!c.diaChi&&p.address)c.diaChi=p.address;if(p.taxId)c.mst=c.mst||p.taxId});
  (S.rkh||new Map()).forEach((d,k)=>{if(!M.has(k)&&d&&d.name)get(d.name)});
  return[...M.values()].map(c=>{const info=(S.rkh&&S.rkh.get(c.key))||{};const best=[...c.names.entries()].sort((a,b)=>b[1]-a[1]||b[0].length-a[0].length)[0];
    const isThue=info.tagThue===true||(info.tagThue!==false&&(c.thue.length>0||(c.jobThue||0)>0)),isMua=info.tagMua===true||(info.tagMua!==false&&(c.mua.length>0||(c.jobMua||0)>0));
    return{...c,info,name:info.name||(best?best[0]:c.name),sdt:info.sdt||c.sdt,diaChi:info.diaChi||c.diaChi,mst:info.mst||c.mst||"",ghiChu:info.ghiChu||"",isThue,isMua,nThue:c.thue.length||c.jobThue||0,nMua:c.mua.length||c.jobMua||0}})}

const CTY_COL=["#1a73e8","#e8710a","#188038","#a142f4","#d93025","#12b5cb","#f9ab00","#c5221f","#0b8043","#5f6368"];
function ctyInit(n){const w=String(n||"").replace(/^(c[oô]ng ty|cty|tnhh|c[oổ] ph[aầ]n|cp|tr[uư][oờ]ng|mtv|tm|dv|th[uư][oơ]ng m[aạ]i|d[iị]ch v[uụ]|v[aà]|m[oộ]t th[aà]nh vi[eê]n|tr[aá]ch nhi[eệ]m h[uữ]u h[aạ]n)\s+/gi,"").trim();let t=w;for(let i=0;i<6;i++)t=t.replace(/^(c[oô]ng ty|cty|tnhh|c[oổ] ph[aầ]n|cp|mtv|tm|dv|th[uư][oơ]ng m[aạ]i|d[iị]ch v[uụ]|v[aà]|m[oộ]t th[aà]nh vi[eê]n|tr[aá]ch nhi[eệ]m h[uữ]u h[aạ]n|đ[aạ]i h[oọ]c|tr[uư][oờ]ng)\s+/i,"");const ws=(t||w||"?").split(/\s+/).map(x=>x.replace(/[^\p{L}\p{N}]/gu,"")).filter(Boolean);return((ws[0]||"?")[0]+(ws.length>1?ws[ws.length-1][0]:"")).toUpperCase()}
function ctyAv(c,sz){sz=sz||36;const logo=c&&c.info&&c.info.logo;if(logo)return`<img class="ctyav" src="${esc(logo)}" alt="" style="width:${sz}px;height:${sz}px">`;let h=0;const k=(c&&c.key)||"";for(const ch of k)h=(h*31+ch.charCodeAt(0))>>>0;return`<span class="ctyav" style="width:${sz}px;height:${sz}px;background:${CTY_COL[h%CTY_COL.length]};font-size:${Math.round(sz*.38)}px">${esc(ctyInit(c&&c.name))}</span>`}
function logoImg(file,size){return new Promise((ok,no)=>{const fr=new FileReader();fr.onerror=()=>no(new Error("Không đọc được ảnh"));fr.onload=()=>{const im=new Image();im.onerror=()=>no(new Error("File không phải ảnh"));im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=size;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,size,size);const pad=size*.08,k=Math.min((size-2*pad)/im.width,(size-2*pad)/im.height),w=im.width*k,h=im.height*k;g.drawImage(im,(size-w)/2,(size-h)/2,w,h);ok(c.toDataURL("image/jpeg",.86))};im.src=fr.result};fr.readAsDataURL(file)})}

  refresh(){const el=this.el,t=today(),in7=new Date(Date.now()+7*864e5).toISOString().slice(0,10),C=(S.care||[]).filter(x=>x.nextDate&&!x.done);
    const sec=(title,list,empty)=>`<div class="panel" style="margin-bottom:12px"><h3 style="margin-bottom:8px">${title} <span class="hint">${list.length}</span></h3><div class="list">${list.map(x=>`<div class="li"><span class="t"><b>${esc(x.khName||x.kh)}</b> · hẹn ${vnDate(x.nextDate)} · ${esc(x.type||"")}: ${esc(x.note||"")} <span class="hint">${esc(pName(x.by))}</span></span><button class="link" type="button" data-ok="${esc(x.kh)}">Mở khách</button><button class="link" type="button" data-cd="${esc(x.id)}">Đã chăm sóc</button></div>`).join("")||`<span class="hint">${empty}</span>`}</div></div>`;
    const custs=custList(),idle=custs.filter(c=>!c.act&&c.lastEnd&&(new Date(t)-new Date(c.lastEnd))/864e5>60&&!C.some(x=>x.kh===c.key)).sort((a,b)=>b.tien-a.tien).slice(0,30);
    const after=(S.rentals||[]).filter(r=>nTT(r.ttThue)==="Đã hoàn thành"&&r.ngayHetHan&&r.ngayHetHan<=t&&(new Date(t)-new Date(r.ngayHetHan))/864e5<=7);
    $('[data-r="b"]',el).innerHTML=sec("Quá hẹn",C.filter(x=>x.nextDate<t),"Không có lịch quá hẹn.")+sec("Hôm nay",C.filter(x=>x.nextDate===t),"Hôm nay không có lịch.")+sec("7 ngày tới",C.filter(x=>x.nextDate>t&&x.nextDate<=in7),"Chưa có lịch hẹn.")
      +`<div class="panel" style="margin-bottom:12px"><h3 style="margin-bottom:8px">Vừa trả máy (7 ngày) – nên hỏi thăm <span class="hint">${after.length}</span></h3><div class="list">${after.map(r=>`<div class="li"><span class="t"><b>${esc(r.kh)}</b> · hết hạn ${vnDate(r.ngayHetHan)} · ${esc(r.may||"").slice(0,60)}</span><button class="link" type="button" data-ok="${esc(kkey(r.kh))}">Mở khách</button></div>`).join("")||'<span class="hint">Không có.</span>'}</div></div>`
      +`<div class="panel"><h3 style="margin-bottom:8px">Lâu không thuê (&gt; 60 ngày) – nên chăm sóc lại <span class="hint">${idle.length}</span></h3><div class="list">${idle.map(c=>`<div class="li"><span class="t"><b>${esc(c.name)}</b> · lần cuối ${vnDate(c.lastEnd)} · đã thuê ${money(c.tien)}</span><button class="link" type="button" data-ok="${esc(c.key)}">Mở khách</button></div>`).join("")||'<span class="hint">Không có.</span>'}</div></div>`;
    $$("[data-ok]",el).forEach(b=>b.addEventListener("click",()=>openCust(b.dataset.ok)));$$("[data-cd]",el).forEach(b=>b.addEventListener("click",async()=>{try{await S.db.doc("care/"+b.dataset.cd).update({done:true})}catch(x){toast(dbErr(x))}}))}};

function qTotal(q){const sub=(q.items||[]).reduce((s,i)=>s+rnum(i.sl)*rnum(i.donGia),0),ck=rnum(q.giam),vat=Math.round((sub-ck)*(rnum(q.vat)/100));return{sub,ck,vat,tong:sub-ck+vat}}
SCR.thue_quote={title:"Báo giá",icon:"docs",
  mount(el){this.el=el;this.st=this.st??"Đang báo giá";el.innerHTML=`<div class="head"><h2>Báo giá thuê máy</h2><button class="btn pri" type="button" data-r="new">+ Lập báo giá</button></div><div class="kpis" data-r="kpi"></div><div class="chips" data-r="st" style="margin:10px 0"></div><div data-r="tbl"></div>`;$('[data-r="new"]',el).addEventListener("click",()=>openQuote())},
  refresh(){const el=this.el,Q=S.quotes||[],cnt=s=>Q.filter(q=>q.status===s).length,won=cnt("Đã chốt"),lost=cnt("Không chốt");
    $('[data-r="kpi"]',el).innerHTML=`<div class="kpi"><span class="l">Đang báo giá</span><span class="v">${cnt("Đang báo giá")} <small class="hint">${money(Q.filter(q=>q.status==="Đang báo giá").reduce((s,q)=>s+qTotal(q).tong,0))}</small></span></div><div class="kpi"><span class="l">Đã chốt</span><span class="v" style="color:var(--in)">${won}</span></div><div class="kpi"><span class="l">Không chốt</span><span class="v">${lost}</span></div><div class="kpi"><span class="l">Tỉ lệ chốt</span><span class="v">${won+lost?Math.round(won*100/(won+lost))+"%":"–"}</span></div>`;
    $('[data-r="st"]',el).innerHTML=["",...QST].map(s=>`<button type="button" class="chip" aria-pressed="${this.st===s}" data-s="${s}">${s||"Tất cả"} <span class="c">${s?cnt(s):Q.length}</span></button>`).join("");$$("[data-s]",el).forEach(b=>b.addEventListener("click",()=>{this.st=b.dataset.s;this.refresh()}));
    const rows=Q.filter(q=>!this.st||q.status===this.st).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    $('[data-r="tbl"]',el).innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Số báo giá</th><th>Ngày</th><th>Khách hàng</th><th>Nội dung</th><th class="num">Tổng tiền</th><th>Hiệu lực đến</th><th>Trạng thái</th><th>Phụ trách</th></tr></thead><tbody>${rows.map(q=>`<tr class="click" data-q="${esc(q.id)}"><td class="mono">${esc(q.code)}</td><td class="nowrap">${vnDate(q.date)}</td><td><b>${esc(q.kh)}</b></td><td class="rmay muted">${esc((q.items||[]).map(i=>rnum(i.sl)+" × "+i.may).join("; "))}</td><td class="num"><b>${fmt(qTotal(q).tong)}</b></td><td class="nowrap${q.status==="Đang báo giá"&&q.hieuLuc&&q.hieuLuc<today()?" r-over":""}">${vnDate(q.hieuLuc)}</td><td>${q.status==="Đã chốt"?'<span class="pill p-in">Đã chốt</span>':q.status==="Không chốt"?`<span class="pill p-ok" title="${esc(q.lyDo||"")}">Không chốt</span>`:'<span class="pill p-low">Đang báo giá</span>'}</td><td class="muted">${esc(pName(q.phuTrach))}</td></tr>`).join("")||'<tr><td colspan="8"><div class="empty"><span>Chưa có báo giá.</span></div></td></tr>'}</tbody></table></div>`;
    $$("[data-q]",el).forEach(tr=>tr.addEventListener("click",()=>openQuote(tr.dataset.q)))}};
function openQuote(id,preset){if(!guard())return;const old=id?(S.quotes||[]).find(x=>x.id===id):null;
  const q=old||{kh:"",sdt:"",diaChi:"",phuTrach:S.uid||"",date:today(),hieuLuc:new Date(Date.now()+7*864e5).toISOString().slice(0,10),ngayDuKien:"",thoiGian:"",items:[{may:"",sl:1,donGia:""}],giam:"",vat:0,ghiChu:"",status:"Đang báo giá",...(preset||{})};
  let items=(q.items||[]).map(i=>({...i}));const khs=[...new Set(custList().map(c=>c.name))];
  dlg(`<h2>${old?"Báo giá "+esc(old.code):"Lập báo giá thuê máy"}</h2>
  <div class="fgrid"><label class="field" style="grid-column:span 2"><span>Khách hàng *</span><input id="qK" list="dl-qkh" value="${esc(q.kh)}"></label><label class="field"><span>Người phụ trách</span><select id="qP">${staffOpts(q.phuTrach)}</select></label>
    <label class="field"><span>SĐT</span><input id="qS" value="${esc(q.sdt||"")}"></label><label class="field" style="grid-column:span 2"><span>Địa chỉ</span><input id="qD" value="${esc(q.diaChi||"")}"></label>
    <label class="field"><span>Ngày báo giá</span><input id="qDt" type="date" value="${esc(q.date||"")}"></label><label class="field"><span>Hiệu lực đến</span><input id="qHl" type="date" value="${esc(q.hieuLuc||"")}"></label><label class="field"><span>Thời gian thuê</span><input id="qTg" list="dl-qtg" value="${esc(q.thoiGian||"")}" placeholder="VD: Thuê 1 tháng"></label>
    <label class="field"><span>Ngày dự kiến giao</span><input id="qNd" type="date" value="${esc(q.ngayDuKien||"")}"></label></div>
  <div class="sec">Hạng mục</div><div class="tbl-wrap"><table><thead><tr><th>Máy / cấu hình</th><th class="num" style="width:80px">SL</th><th class="num" style="width:140px">Đơn giá (đ)</th><th class="num" style="width:130px">Thành tiền</th><th></th></tr></thead><tbody id="qL"></tbody></table></div>
  <button class="btn" type="button" id="qAdd" style="margin-top:6px">+ Thêm dòng</button>
  <div class="fgrid" style="margin-top:8px"><label class="field"><span>Giảm giá (đ)</span><input id="qG" type="number" min="0" value="${esc(q.giam||"")}"></label><label class="field"><span>VAT (%)</span><input id="qV" type="number" min="0" max="20" value="${esc(q.vat||0)}"></label><div class="rcalc" id="qT" style="grid-column:span 2;align-self:end"></div>
    <label class="field" style="grid-column:1/-1"><span>Ghi chú / điều kiện</span><textarea id="qN" rows="2">${esc(q.ghiChu||"")}</textarea></label></div>
  <datalist id="dl-qkh">${khs.map(x=>`<option value="${esc(x)}">`).join("")}</datalist><datalist id="dl-qtg"><option value="Thuê 1 ngày"><option value="Thuê 1 tuần"><option value="Thuê 1 tháng"><option value="Thuê 3 tháng"><option value="Thuê 6 tháng"></datalist>
  ${old&&old.status==="Không chốt"&&old.lyDo?`<p class="hint">Lý do không chốt: ${esc(old.lyDo)}</p>`:""}${old&&old.rentalId?`<p class="hint">Đã chốt thành đơn thuê. <button class="link" type="button" id="qOpenR">Mở đơn thuê</button></p>`:""}
  <label class="field" id="qLyW" hidden><span>Lý do không chốt</span><input id="qLy" list="dl-qly" placeholder="VD: giá cao, khách chọn bên khác, hoãn sự kiện"></label><datalist id="dl-qly"><option value="Giá cao"><option value="Khách chọn bên khác"><option value="Hoãn / huỷ sự kiện"><option value="Không đủ máy"></datalist><span class="err" id="qE" hidden></span>
  <div class="actions">${old?`<button class="btn danger" type="button" id="qDel">Xoá</button>`:""}${old&&old.status==="Đang báo giá"?`<button class="btn" type="button" id="qLost">Không chốt</button><button class="btn" type="button" id="qWin">Chốt → lên đơn thuê</button>`:""}<span class="sp"></span><button class="btn" type="button" id="qPr">In / tải báo giá</button><button class="btn" type="button" data-close>Đóng</button><button class="btn pri" type="button" id="qOK">Lưu báo giá</button></div>`);
  $("#dlg").classList.add("wide");$("#dlg").addEventListener("close",()=>$("#dlg").classList.remove("wide"),{once:true});
  const err=m=>{$("#qE").textContent=m;$("#qE").hidden=!m};
  const cur=()=>({kh:$("#qK").value.trim(),sdt:$("#qS").value.trim(),diaChi:$("#qD").value.trim(),phuTrach:$("#qP").value,date:$("#qDt").value||today(),hieuLuc:$("#qHl").value,thoiGian:$("#qTg").value.trim(),ngayDuKien:$("#qNd").value,items:items.filter(i=>i.may||rnum(i.donGia)),giam:$("#qG").value===""?"":+$("#qG").value,vat:+$("#qV").value||0,ghiChu:$("#qN").value.trim()});
  const tot=()=>{const t=qTotal(cur());$("#qT").innerHTML=`<span>Cộng <b>${money(t.sub)}</b></span>${t.ck?`<span>Giảm <b>${money(t.ck)}</b></span>`:""}${t.vat?`<span>VAT <b>${money(t.vat)}</b></span>`:""}<span>Tổng <b style="color:var(--accent)">${money(t.tong)}</b></span>`};
  const draw=()=>{$("#qL").innerHTML=items.map((i,k)=>`<tr><td><input data-i="${k}" data-f="may" value="${esc(i.may||"")}" placeholder="VD: Laptop Dell 5480 i5 8GB SSD 256GB 14&quot;"></td><td><input data-i="${k}" data-f="sl" type="number" min="0" value="${esc(i.sl??"")}" style="text-align:right"></td><td><input data-i="${k}" data-f="donGia" type="number" min="0" value="${esc(i.donGia??"")}" style="text-align:right"></td><td class="num" data-tt="${k}">${fmt(rnum(i.sl)*rnum(i.donGia))}</td><td><button class="link" type="button" data-rm="${k}">Bỏ</button></td></tr>`).join("");
    $$("#qL [data-i]").forEach(inp=>inp.addEventListener("input",()=>{const k=+inp.dataset.i;items[k][inp.dataset.f]=inp.dataset.f==="may"?inp.value:(inp.value===""?"":+inp.value);$(`#qL [data-tt="${k}"]`).textContent=fmt(rnum(items[k].sl)*rnum(items[k].donGia));tot()}));
    $$("#qL [data-rm]").forEach(b=>b.addEventListener("click",()=>{items.splice(+b.dataset.rm,1);if(!items.length)items.push({may:"",sl:1,donGia:""});draw();tot()}))};draw();tot();
  ["qG","qV"].forEach(i=>$("#"+i).addEventListener("input",tot));$("#qAdd").addEventListener("click",()=>{items.push({may:"",sl:1,donGia:""});draw()});
  $("#qK").addEventListener("change",()=>{const c=custList().find(x=>norm(x.name)===norm($("#qK").value));if(c){if(!$("#qS").value)$("#qS").value=c.sdt||"";if(!$("#qD").value)$("#qD").value=c.diaChi||""}});
  const save=async extra=>{const d=cur();if(!d.kh){err("Nhập tên khách hàng.");return null}if(!d.items.length){err("Thêm ít nhất một hạng mục.");return null}
    try{if(old){await S.db.doc("quotes/"+old.id).update({...d,...(extra||{}),updatedAt:Date.now()});return old.id}const ref=await S.db.collection("quotes").add({...d,code:rCode("BG",S.quotes,d.date),status:"Đang báo giá",...(extra||{}),createdBy:S.uid||null,ts:Date.now()});return ref.id}catch(x){err(dbErr(x));return null}};
  $("#qOK").addEventListener("click",async()=>{if(await save()){$("#dlg").close();toast("Đã lưu báo giá")}});
  $("#qPr").addEventListener("click",()=>{const d=cur();printQuote({...q,...d,code:old?old.code:rCode("BG",S.quotes,d.date)})});
  const w=$("#qWin");if(w)w.addEventListener("click",async()=>{const qid=await save();if(!qid)return;const d=cur(),t=qTotal(d);$("#dlg").close();
    openRental(null,{kh:d.kh,sdt:d.sdt,diaChi:d.diaChi,phuTrach:d.phuTrach,ngayThue:d.ngayDuKien||today(),thoiGian:d.thoiGian,ngayHetHan:rAddTime(d.ngayDuKien||today(),d.thoiGian),may:d.items.map(i=>(rnum(i.sl)>1?rnum(i.sl)+" × ":"")+i.may).join("\n"),sl:d.items.reduce((s,i)=>s+rnum(i.sl),0),tien:t.tong,ttThue:"Chưa giao",ttThu:"Chưa thu",soHD:"ĐXHĐ",fromQuote:qid})});
  const l=$("#qLost");if(l){let a=false;l.addEventListener("click",async()=>{if(!a){a=true;$("#qLyW").hidden=false;$("#qLy").focus();l.textContent="Xác nhận không chốt";return}if(await save({status:"Không chốt",lyDo:$("#qLy").value.trim(),closedAt:today()})){$("#dlg").close();toast("Đã đánh dấu không chốt")}})}
  const del=$("#qDel");if(del){let a=false;del.addEventListener("click",async()=>{if(!a){a=true;del.textContent="Bấm lần nữa để xoá";return}try{await S.db.doc("quotes/"+old.id).delete();$("#dlg").close();toast("Đã xoá báo giá")}catch(x){err(dbErr(x))}})}
  const orr=$("#qOpenR");if(orr)orr.addEventListener("click",()=>{$("#dlg").close();openRental(old.rentalId)})}

const DOCCSS=`@page{size:A4;margin:16mm}@media screen{body{max-width:820px;margin:24px auto!important;padding:0 20px}}body{font-family:"Times New Roman",Times,serif;font-size:13pt;color:#000;margin:0;line-height:1.45}.hint{font-family:Arial,sans-serif;font-size:11px;color:#666;margin-bottom:8px}@media print{.hint{display:none}}
.hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #2e7046;padding-bottom:8px;margin-bottom:12px}.hd .co b{font-size:14pt;color:#2e7046}.hd .co{font-size:11.5pt}
h1{text-align:center;font-size:17pt;margin:14px 0 2px}.sub{text-align:center;margin:0 0 12px;font-style:italic}table{width:100%;border-collapse:collapse;margin:8px 0}th,td{border:1px solid #444;padding:5px 7px;vertical-align:top}th{background:#eef5ef}.num{text-align:right;white-space:nowrap}
.sig{display:grid;grid-template-columns:1fr 1fr;text-align:center;margin-top:28px}.sig i{display:block;font-size:11pt;margin-bottom:70px}h3{font-size:13pt;margin:12px 0 4px}p{margin:4px 0}`;
function docHead(){const c=S.company||{};return`<div class="hint">Mở file bằng trình duyệt rồi nhấn Ctrl+P (⌘P trên Mac) để in hoặc lưu PDF.</div><div class="hd"><div class="co"><b>${esc(c.name||"CÔNG TY TNHH TM DV SKYLAP")}</b><br>${esc(c.address||"")}${c.phone?"<br>ĐT: "+esc(c.phone):""}${c.taxId?" · MST: "+esc(c.taxId):""}<br>Website: skylap.vn</div><div style="text-align:right;font-size:11pt">Dịch vụ cho thuê máy tính<br><i>Luôn đặt trọn niềm tin</i></div></div>`}
const dmy=s=>{const[a,b,c]=(s||today()).split("-");return`ngày ${c} tháng ${b} năm ${a}`};
function printQuote(q){const t=qTotal(q);saveFile((q.code||"bao-gia")+".html",`<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>${esc(q.code||"Báo giá")}</title><style>${DOCCSS}</style></head><body>${docHead()}
<h1>BÁO GIÁ THUÊ MÁY TÍNH</h1><p class="sub">Số: ${esc(q.code||"")} · TP.HCM, ${dmy(q.date)}</p>
<p>Kính gửi: <b>${esc(q.kh)}</b>${q.sdt?" · ĐT: "+esc(q.sdt):""}</p>${q.diaChi?`<p>Địa chỉ: ${esc(q.diaChi)}</p>`:""}<p>SKYLAP trân trọng gửi Quý khách báo giá dịch vụ cho thuê máy tính${q.thoiGian?" ("+esc(q.thoiGian)+")":""} như sau:</p>
<table><thead><tr><th style="width:36px">STT</th><th>Thiết bị / cấu hình</th><th style="width:60px">SL</th><th style="width:120px">Đơn giá (đ)</th><th style="width:130px">Thành tiền (đ)</th></tr></thead><tbody>${(q.items||[]).map((i,k)=>`<tr><td class="num">${k+1}</td><td>${esc(i.may||"").replace(/\n/g,"<br>")}</td><td class="num">${fmt(i.sl)}</td><td class="num">${fmt(i.donGia)}</td><td class="num">${fmt(rnum(i.sl)*rnum(i.donGia))}</td></tr>`).join("")}
<tr><td colspan="4" class="num">Cộng</td><td class="num">${fmt(t.sub)}</td></tr>${t.ck?`<tr><td colspan="4" class="num">Giảm giá</td><td class="num">-${fmt(t.ck)}</td></tr>`:""}${t.vat?`<tr><td colspan="4" class="num">VAT ${rnum(q.vat)}%</td><td class="num">${fmt(t.vat)}</td></tr>`:""}<tr><td colspan="4" class="num"><b>TỔNG CỘNG</b></td><td class="num"><b>${fmt(t.tong)}</b></td></tr></tbody></table>
<p><i>Bằng chữ: ${esc(vnWords(t.tong))}.</i></p>${q.ngayDuKien?`<p>Thời gian giao dự kiến: ${vnDate(q.ngayDuKien)}.</p>`:""}<p>Báo giá có hiệu lực đến ${vnDate(q.hieuLuc)||"7 ngày kể từ ngày báo giá"}.</p>${q.ghiChu?`<p>Ghi chú: ${esc(q.ghiChu).replace(/\n/g,"<br>")}</p>`:""}
<p>Giá đã bao gồm cài đặt phần mềm theo yêu cầu, giao nhận và hỗ trợ kỹ thuật trong thời gian thuê.</p>
<div class="sig"><div><b>KHÁCH HÀNG</b><i>(Ký, họ tên)</i></div><div><b>ĐẠI DIỆN SKYLAP</b><i>(Ký, họ tên)</i>${esc(pName(q.phuTrach))}</div></div></body></html>`)}
function printContract(r){const c=S.company||{},x=rcalc(r),info=(S.rkh&&S.rkh.get(kkey(r.kh)))||{};saveFile("hop-dong-"+(r.code||kkey(r.kh))+".html",`<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Hợp đồng thuê máy</title><style>${DOCCSS}</style></head><body>${docHead()}
<p style="text-align:center"><b>CỘNG HOÀ XÃ HỘI CHỦ NGHĨA VIỆT NAM</b><br><u>Độc lập – Tự do – Hạnh phúc</u></p><h1>HỢP ĐỒNG THUÊ MÁY TÍNH</h1><p class="sub">Số: ${esc(r.code||r.soHD||"……")} · TP.HCM, ${dmy(r.ngayThue)}</p>
<h3>BÊN CHO THUÊ (Bên A): ${esc(c.name||"CÔNG TY TNHH TM DV SKYLAP")}</h3><p>Địa chỉ: ${esc(c.address||"……")} · ĐT: ${esc(c.phone||"……")} · MST: ${esc(c.taxId||"……")}</p>
<h3>BÊN THUÊ (Bên B): ${esc(r.kh)}</h3><p>Địa chỉ: ${esc(info.diaChi||r.diaChi||"……")} · ĐT: ${esc(info.sdt||r.sdt||"……")}${info.mst?" · MST: "+esc(info.mst):""}${info.lienHe?" · Người liên hệ: "+esc(info.lienHe):""}</p>
<h3>Điều 1. Thiết bị cho thuê</h3><table><thead><tr><th>Thiết bị / cấu hình</th><th style="width:70px">SL</th></tr></thead><tbody><tr><td>${esc(r.may||"").replace(/\n/g,"<br>")}${r.sn?`<br><small>Số seri: ${esc(r.sn).replace(/\n/g,", ")}</small>`:""}</td><td class="num">${esc(r.sl??"")}</td></tr></tbody></table>

<h3>Điều 4. Trách nhiệm các bên</h3><p>Bên A giao thiết bị đúng cấu hình, hoạt động tốt; hỗ trợ kỹ thuật và đổi máy khi máy lỗi do phần cứng trong thời gian thuê.</p><p>Bên B sử dụng thiết bị đúng mục đích, bảo quản cẩn thận; không tự ý tháo lắp, sửa chữa hoặc cho bên thứ ba thuê lại; bồi thường nếu làm mất, hư hỏng do lỗi của Bên B; trả thiết bị đúng hạn.</p>

function donutSvg(items,center,sub){const tot=items.reduce((a,b)=>a+b.v,0);if(!tot)return'<span class="hint">Chưa có dữ liệu.</span>';const R=70,r=44,C=90;let a0=-Math.PI/2,g="";

  return`<div class="donut"><svg viewBox="0 0 180 180" style="width:150px;height:150px;flex:none;color:var(--ink)">${g}<text x="90" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor">${esc(center||"")}</text><text x="90" y="106" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">${esc(sub||"")}</text></svg>

function lineSvg(labels,series,opt){opt=opt||{};const W=560,H=220,P=54,n=labels.length,max=Math.max(1,...series.flatMap(s=>s.v.filter(v=>v!=null))),x=i=>P+i*(W-P-14)/(n-1||1),y=v=>H-26-(v/max)*(H-46);

function saleInfo(pid){let best=null;
  S.txns.forEach(t=>{if(t.type==="sale")(t.lines||[]).forEach(l=>{if(l.pid===pid&&(!best||t.date>=best.date))best={date:t.date,customer:t.partner||"Khách lẻ",code:t.code,months:warrantyOf(S.products.get(pid),l),txn:t}})});
  S.jobs.forEach(j=>{if(!/ban/.test(norm(j.mucDich))||!gvDelivered(j))return;if(jobItems(j).some(i=>i.pid===pid)){const d=j.ngayGiao||j.doneAt||"";if(d&&(!best||d>=best.date))best={date:d,customer:j.congTy,code:"Giao việc",months:warrantyOf(S.products.get(pid)),job:j}}});
  if(best){best.until=best.months?addMonths(best.date,best.months):"";best.left=best.until?Math.round((Date.parse(best.until)-Date.parse(today()))/864e5):null}return best}
